# Sync Release Channels Workflow
# This workflow syncs main -> canary -> beta -> stable

name: Sync Release Channels

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to sync from'
        required: true
        type: choice
        options:
          - main
          - release/canary
          - release/beta
      target_branch:
        description: 'Target branch to sync to'
        required: true
        type: choice
        options:
          - release/canary
          - release/beta
          - release/stable
      dry_run:
        description: 'Dry run (no actual push)'
        required: false
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Validate branch combination
        run: |
          VALID_COMBOS='{"main":["release/canary"],"release/canary":["release/beta"],"release/beta":["release/stable"]}'
          echo "Validating sync: ${{ inputs.source_branch }} -> ${{ inputs.target_branch }}"
          
          if echo "$VALID_COMBOS" | jq -e --arg src "${{ inputs.source_branch }}" --arg tgt "${{ inputs.target_branch }}" '.[$src] | index($tgt)' > /dev/null; then
            echo "Valid combination"
          else
            echo "Invalid sync combination: ${{ inputs.source_branch }} -> ${{ inputs.target_branch }}"
            echo "Valid combinations:"
            echo "$VALID_COMBOS" | jq .
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync branches
        run: |
          if ${{ inputs.dry_run }}; then
            echo "DRY RUN: Would sync ${{ inputs.source_branch }} -> ${{ inputs.target_branch }}"
            git fetch origin ${{ inputs.source_branch }} ${{ inputs.target_branch }}
            echo "Source commit: $(git rev-parse origin/${{ inputs.source_branch }})"
            echo "Target commit: $(git rev-parse origin/${{ inputs.target_branch }})"
          else
            echo "Syncing ${{ inputs.source_branch }} -> ${{ inputs.target_branch }}"
            git fetch origin ${{ inputs.source_branch }} ${{ inputs.target_branch }}
            git checkout ${{ inputs.target_branch }}
            git merge origin/${{ inputs.source_branch }} --no-edit
            git push origin ${{ inputs.target_branch }}
            echo "Sync complete!"
          fi

      - name: Create promotion tag
        if: ${{ !inputs.dry_run }}
        run: |
          TAG_NAME="promotion/$(date +%Y%m%d-%H%M%S)/${{ inputs.source_branch }}-to-${{ inputs.target_branch }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Created tag: $TAG_NAME"
