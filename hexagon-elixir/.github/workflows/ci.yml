# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: elixir:1.18-otp-27
    steps:
      - uses: actions/checkout@v4
      - name: Run Credo
        run: mix credo || true

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: elixir:1.18-otp-27
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Setup dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Run tests
        run: mix test

  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: elixir:1.18-otp-27
    steps:
      - uses: actions/checkout@v4
      - name: Setup dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Build
        run: MIX_ENV=prod mix release
