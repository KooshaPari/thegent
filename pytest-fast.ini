# Fast pytest lane configuration — WL-134 B90-W2-E2
# Runs only tests marked as unit tests not in service-heavy lanes.
# Use: uv run pytest -c pytest-fast.ini
# NOT for global use — opt-in only to avoid disrupting other test lanes.
[pytest]
addopts = -m "unit and not slow and not integration and not e2e and not load and not deep and not chaos and not a11y" --exitfirst --strict-markers -q
markers =
    fast: core-contract and unit tests that run in the fast lane (no I/O, no external services)
    unit: marks unit tests
    slow: marks slow tests (deselect with -m 'not slow')
    integration: marks tests that call real agents (deselect with -m 'not integration')
    e2e: marks end-to-end CLI tests
    load: marks load/stress tests
    deep: marks integration/chaos tests that may be slow or require services (WL-134)
    chaos: marks chaos/resilience tests
    a11y: marks accessibility tests
    requirement: marks tests with a specific requirement ID for traceability (e.g. WL-030, FR-XXX-NNN)
    asyncio: marks async tests (pytest-asyncio)
