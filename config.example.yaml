# thegent configuration example
#
# Copy this file and adjust for your environment.
# The majority of settings can also be supplied as environment variables
# (prefix: THGENT_). Environment variables override file values.
#
# Quick start: thegent mcp up
# Full guide:  docs/guides/PROVIDER_SETUP_GUIDE.md

# ---------------------------------------------------------------------------
# Server / MCP
# ---------------------------------------------------------------------------
# THGENT_MCP_HOST / THGENT_MCP_PORT
mcp_host: "127.0.0.1"
mcp_port: 3847

# ---------------------------------------------------------------------------
# CLIProxyAPIPlus (proxy for Cursor, Kiro, Antigravity, MiniMax, etc.)
# ---------------------------------------------------------------------------
# THGENT_CLIPROXY_PORT
cliproxy_port: 8317

# Path to CLIProxyAPIPlus config (generated by thegent cliproxy ensure-config)
# THGENT_CLIPROXY_CONFIG_PATH
cliproxy_config_path: "~/.config/thegent/cliproxy-config.yaml"

# ---------------------------------------------------------------------------
# Cursor — Phase 2 (G-CP-01 / WL-018)
#
# Two auth flows are supported:
#
#   A. Zero-action (recommended): Cursor IDE logs in automatically.
#      Set THGENT_CURSOR_API_TOKEN to the cursor-api AUTH_TOKEN.
#      The proxy reads the token directly from Cursor IDE state.vscdb.
#
#   B. token-file: Obtain sk-... from cursor-api /build-key, write to a file.
#      Set THGENT_CURSOR_TOKEN_FILE to the file path (or auto-discovered from
#      ~/.cursor-server/session-token.txt).
#
# See docs/guides/PROVIDER_SETUP_GUIDE.md#cursor for full setup instructions.
# ---------------------------------------------------------------------------

# cursor-api server URL (wisdgod fork)
# THGENT_CURSOR_API_URL
cursor_api_url: "http://127.0.0.1:3000"

# Bearer token — either AUTH_TOKEN (zero-action) or sk-... (token-file flow)
# THGENT_CURSOR_API_TOKEN
# cursor_api_token: ""

# Explicit path to the sk-... token file (Phase 2 token-file provider).
# When unset, thegent auto-discovers ~/.cursor-server/session-token.txt etc.
# THGENT_CURSOR_TOKEN_FILE
# cursor_token_file: "~/.cursor/session-token.txt"

# How often (seconds) to re-read the token file.
# Decrease for short-lived tokens; increase for stable long-lived tokens.
# THGENT_CURSOR_TOKEN_REFRESH_INTERVAL
cursor_token_refresh_interval: 300

# CLIProxy block written by thegent cliproxy ensure-config (token-file variant):
#
#   cursor:
#     - token-file: "~/.cursor/session-token.txt"
#       cursor-api-url: "http://127.0.0.1:3000"
#
# CLIProxy block for zero-action (auth-token variant):
#
#   cursor:
#     - cursor-api-url: "http://127.0.0.1:3000"
#       auth-token: "${CURSOR_API_AUTH_TOKEN}"

# ---------------------------------------------------------------------------
# Worker Pool (MTSP-06)
# ---------------------------------------------------------------------------
# THGENT_WORKER_POOL_SIZE — number of warm Python workers (default 4)
# THGENT_WORKER_IDLE_TIMEOUT — evict workers idle > N seconds (default 300)

# ---------------------------------------------------------------------------
# Routing
# ---------------------------------------------------------------------------
# prefer_direct | prefer_proxy | failover
# THGENT_DEFAULT_ROUTING
default_routing: "prefer_direct"

# ---------------------------------------------------------------------------
# Session / retention
# ---------------------------------------------------------------------------
# THGENT_SESSION_DIR
# session_dir: "~/.cache/thegent/sessions"

# THGENT_RETENTION_DAYS_SESSIONS
retention_days_sessions: 30

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# development | staging | production
# THGENT_ENVIRONMENT
environment: "development"
