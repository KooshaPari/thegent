[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "thegent-mcp"
dynamic = ["version"]
description = "FastMCP server integration for thegent"
authors = [
    { name = "Koosha Paridehpour", email = "kooshapari@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp[tasks]>=3.0.0",
    "starlette>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
