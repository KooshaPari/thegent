[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thegent-mcp"
version = "0.1.0"
description = "thegent MCP server - FastMCP 3.x protocol layer for agent integration and tool orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[tasks]>=3.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
thegent-mcp = "thegent_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_mcp"]
