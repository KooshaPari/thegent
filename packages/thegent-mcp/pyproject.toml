[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "thegent-mcp"
dynamic = ["version"]
description = "thegent MCP server - FastMCP 3.x protocol layer for agent integration and tool orchestration"
authors = [
    { name = "Koosha Paridehpour", email = "kooshapari@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp[tasks]>=3.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
    "starlette>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
thegent-mcp = "thegent_mcp.server:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
