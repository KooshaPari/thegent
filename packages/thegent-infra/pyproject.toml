[project]
name = "thegent-infra"
version = "0.1.0"
description = "Reusable infrastructure layer: subprocess, caching, IPC, file ops, resource management"
requires-python = ">=3.12"
dependencies = [
    "thegent-config",
    "orjson>=3.9",
    "pydantic>=2.0",
    "psutil>=5.9",
]

[tool.uv.sources]
thegent-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_infra"]
