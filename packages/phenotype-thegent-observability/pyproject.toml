[project]
name = "phenotype-thegent-observability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "phenotype-thegent-core",
    "structlog>=24.0",
]

[tool.uv.sources]
phenotype-thegent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phenotype_thegent_observability"]
