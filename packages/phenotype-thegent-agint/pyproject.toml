[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "phenotype-thegent-agint"
dynamic = ["version"]
description = "Productized git coordination component extracted from thegent CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "phenotype-thegent-agents",
    "thegent-platform",
    "phenotype-thegent-core",
    "typer>=0.16.0",
    "rich>=13.9.4",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.uv.sources]
phenotype-thegent-agents = { workspace = true }
thegent-platform = { workspace = true }
phenotype-thegent-core = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
