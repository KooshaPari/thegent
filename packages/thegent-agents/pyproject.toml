[project]
name = "thegent-agents"
version = "0.1.0"
requires-python = ">=3.12"
description = "Agent orchestration and persona management for thegent"
dependencies = [
    "thegent-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_agents"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
