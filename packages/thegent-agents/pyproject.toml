[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "thegent-agents"
dynamic = ["version"]
description = "Agent orchestration and persona management for thegent"
authors = [
    { name = "Koosha Paridehpour", email = "kooshapari@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tenacity>=9.0.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_agents"]
