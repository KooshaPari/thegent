[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thegent-agents"
version = "0.1.0"
description = "thegent agents sub-package - agent runner and orchestration layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "thegent-core>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_agents"]
