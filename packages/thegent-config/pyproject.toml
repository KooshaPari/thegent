[project]
name = "thegent-config"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "thegent-core",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "orjson>=3.9",
]

[tool.uv.sources]
thegent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_config"]
