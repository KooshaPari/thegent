[project]
name = "thegent-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "phenotype-thegent-core",
    "thegent-execution",
]

[tool.uv.sources]
phenotype-thegent-core = { workspace = true }
thegent-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_sync"]
