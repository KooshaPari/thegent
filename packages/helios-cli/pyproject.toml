[project]
name = "helios-cli"
version = "0.1.0"
description = "Helios CLI - Unified command line interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27.0",
]

[project.scripts]
helios = "helioscli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/helioscli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
