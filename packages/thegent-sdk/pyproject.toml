[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thegent-sdk"
version = "0.1.0"
description = "Typed Python SDK for thegent HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_sdk"]
