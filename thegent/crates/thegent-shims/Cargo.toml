[package]
name = "thegent-shims"
version = "0.2.0"
edition = "2021"
description = "High-performance Rust shims for thegent (git, grep, find, agent)"
authors = ["thegent"]
license = "MIT"

[[bin]]
name = "thegent-shims"
path = "src/main.rs"

[[bin]]
name = "thegent-git"
path = "src/shims/git.rs"

[[bin]]
name = "thegent-grep"
path = "src/shims/grep.rs"

[[bin]]
name = "thegent-find"
path = "src/shims/find.rs"

[[bin]]
name = "thegent-agent"
path = "src/shims/agent.rs"

[[bin]]
name = "thegent-git-checkout"
path = "src/shims/git_checkout.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
which = "7"
directories = "5"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.40", features = ["rt", "sync", "time"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
