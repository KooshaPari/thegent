[package]
name = "thegent-wasm-tools"
version = "0.1.0"
edition = "2021"
description = "Zig SDK for building Wasm tools with Extism integration"
authors = ["thegent"]
license = "MIT"

[features]
default = []
# Enable native Extism bindings (requires libextism)
extism-native = []

[dependencies]
thiserror = "2.0"

[dev-dependencies]

# Build that checks for Zig installation
[package.metadata.zig]
min_version = "0.13"
