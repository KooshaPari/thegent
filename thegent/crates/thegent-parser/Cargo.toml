[package]
name = "thegent-parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "thegent_parser"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.1", optional = true, features = ["abi3-py312", "extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
anyhow = "1.0.101"
regex = "1.11"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }

[features]
default = ["python"]
python = ["dep:pyo3"]
