[package]
name = "thegent-benchmark"
version = "0.1.0"
edition = "2021"
description = "Comprehensive benchmarking suite for thegent performance optimizations"

[[bin]]
name = "thegent-benchmark"
path = "src/main.rs"

[dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rayon = "1.10.0"
tokio = { version = "1.49.0", features = ["full"] }
hyperfine = "0.1.0"
clap = { version = "4.5.59", features = ["derive"] }
indicatif = "0.17.11"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "tool_detection"
harness = false

[[bench]]
name = "path_resolution"
harness = false

[[bench]]
name = "process_scanning"
harness = false
