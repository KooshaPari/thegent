# Python import-linter -- architecture boundary enforcement
# Enforces clean architecture layer isolation
[importlinter]
root_package = app

[importlinter:contract:1]
name = Domain must not import from infrastructure
type = forbidden
source_modules =
    app.domain
forbidden_modules =
    app.infrastructure
    app.api
    app.cli

[importlinter:contract:2]
name = Domain must not import from application layer
type = forbidden
source_modules =
    app.domain
forbidden_modules =
    app.application

[importlinter:contract:3]
name = Application layer must not import from infrastructure
type = forbidden
source_modules =
    app.application
forbidden_modules =
    app.infrastructure
    app.api
    app.cli

[importlinter:contract:4]
name = Layers ordering
type = layers
layers =
    app.api
    app.cli
    app.application
    app.domain
