# Tach — Python architecture boundary enforcement
# Enforces module dependency rules at the import level
# Install: pip install tach
# Run: tach check
# Docs: https://github.com/gauge-sh/tach

[tool.tach]
# Define module boundaries
[[tool.tach.modules]]
path = "app.domain"
depends_on = []  # Domain has NO dependencies

[[tool.tach.modules]]
path = "app.application"
depends_on = ["app.domain"]  # Application depends only on domain

[[tool.tach.modules]]
path = "app.infrastructure"
depends_on = ["app.domain", "app.application"]

[[tool.tach.modules]]
path = "app.api"
depends_on = ["app.domain", "app.application"]

[[tool.tach.modules]]
path = "app.cli"
depends_on = ["app.domain", "app.application"]

# Strict mode: fail on any violation
[tool.tach.config]
strict = true
exclude = ["tests", "scripts", "migrations"]
