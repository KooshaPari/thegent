; import-linter — Python architecture boundary enforcement
; Enforces module dependency rules at the import level
; Install: pip install import-linter
; Run: lint-imports
; Docs: https://import-linter.readthedocs.io/

[importlinter]
root_packages =
    myapp

; Layered architecture contract: each layer can only import from layers below it
[importlinter:contract:layers]
name = Layered Architecture
type = layers
layers =
    myapp.presentation
    myapp.application
    myapp.domain
    myapp.infrastructure

; Domain independence: domain layer must not depend on infrastructure or presentation
[importlinter:contract:domain-independence]
name = Domain has no external dependencies
type = forbidden
source_modules =
    myapp.domain
forbidden_modules =
    myapp.infrastructure
    myapp.presentation
    myapp.api

; Infrastructure isolation: infrastructure must not import from presentation
[importlinter:contract:infra-isolation]
name = Infrastructure does not depend on presentation
type = forbidden
source_modules =
    myapp.infrastructure
forbidden_modules =
    myapp.presentation
    myapp.api
