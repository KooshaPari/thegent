# pytest config — strict mode with 12 markers
# Copy to project pyproject.toml [tool.pytest.ini_options]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--no-header",
    "-q",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may use real services)",
    "e2e: End-to-end tests (full system)",
    "slow: Tests that take >5 seconds",
    "smoke: Quick sanity checks",
    "regression: Regression tests for fixed bugs",
    "security: Security-focused tests",
    "performance: Performance benchmarks",
    "requirement(id): Links test to FR ID (e.g. @pytest.mark.requirement('FR-AUTH-001'))",
    "wip: Work in progress (skip in CI)",
    "destructive: Tests that modify shared state",
    "flaky: Known flaky tests (quarantined)",
]
