# mutmut (Python mutation testing) configuration
[mutmut]
paths_to_mutate = src/
tests_dir = tests/
runner = python -m pytest -x --tb=short
dict_synonyms = Struct, NamedStruct
backup = false
use_coverage = true
# Require 60% minimum mutation score
# Run: mutmut run && mutmut results
# Check: mutmut junitxml > mutmut-results.xml
