version: '3'

vars:
  BASH_SRC: '{{.BASH_SRC | default "scripts"}}'

tasks:
  lint:
    desc: Run shellcheck on all bash scripts
    cmds:
      - find {{.BASH_SRC}} -name '*.sh' -o -name '*.bash' | xargs shellcheck

  test:
    desc: Run BATS tests
    cmds:
      - bats tests/

  format:
    desc: Format bash scripts with shfmt
    cmds:
      - shfmt -w -i 2 -ci {{.BASH_SRC}}

  format:check:
    desc: Check bash formatting
    cmds:
      - shfmt -d -i 2 -ci {{.BASH_SRC}}

  all:
    desc: Run all bash quality checks
    deps: [lint, format:check, test]
