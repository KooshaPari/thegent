version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gofumpt
    - revive
    - gosec
    - bodyclose
    - noctx
    - exhaustive
    - gocritic
    - godot
    - misspell
    - prealloc
    - unconvert
    - unparam
    - wastedassign
  settings:
    govet:
      enable-all: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: var-naming
    gosec:
      severity: medium
      confidence: medium
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
output:
  formats:
    - format: colored-line-number
