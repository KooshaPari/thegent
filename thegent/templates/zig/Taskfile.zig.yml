version: '3'

vars:
  ZIG_VERSION: '{{.ZIG_VERSION | default "0.14"}}'

tasks:
  build:
    desc: Build project in debug mode
    cmds:
      - zig build

  build:release:
    desc: Build project in release mode (optimized for speed)
    cmds:
      - zig build -Doptimize=ReleaseFast

  build:small:
    desc: Build project in release mode (optimized for size)
    cmds:
      - zig build -Doptimize=ReleaseSmall

  build:safe:
    desc: Build project in release mode (with safety checks)
    cmds:
      - zig build -Doptimize=ReleaseSafe

  test:
    desc: Run unit tests
    cmds:
      - zig build test

  run:
    desc: Run the application
    cmds:
      - zig build run

  fmt:
    desc: Format code with zig fmt
    cmds:
      - zig fmt src/ tests/ build.zig

  fmt:check:
    desc: Check formatting without modifying
    cmds:
      - zig fmt --check src/ tests/ build.zig

  check:
    desc: Check for compilation errors (fast)
    cmds:
      - zig build-exe src/main.zig --check

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf zig-cache/ zig-out/

  docs:
    desc: Generate documentation
    cmds:
      - zig build-obj -fgenerate-docs src/main.zig

  quality:
    desc: Run all quality checks (format check, test, build)
    deps: [fmt:check, test, build]
