# Self-Healing Swarm Controller Configuration
# This file controls the behavior of the swarm controller, including health monitoring,
# scaling, resource management, and auto-healing policies.

config:
  # ============================================================================
  # Health Monitoring Configuration
  # ============================================================================

  # How frequently to check agent health (seconds)
  health_check_interval: 10

  # Threshold for detecting stale agents - no heartbeat for N seconds
  stale_threshold: 30

  # SLO time multiplier - alert if activity takes > expected_time * multiplier
  # (e.g., 1.5 = 150% of expected time)
  slo_time_multiplier: 1.5

  # ============================================================================
  # Pause vs Kill Logic
  # ============================================================================

  # Enable graceful pause (SIGSTOP) instead of immediately killing agents
  graceful_pause_enabled: true

  # Maximum number of automatic restart attempts before escalation to L1
  max_restart_attempts: 3

  # ============================================================================
  # Dynamic Scaling Configuration
  # ============================================================================

  # Scale UP when pending queue items exceed this threshold
  scale_up_queue_threshold: 5

  # Scale DOWN when pending queue items fall below this threshold
  scale_down_queue_threshold: 2

  # Maximum number of concurrent agents to run
  max_concurrent_agents: 10

  # Minimum number of concurrent agents to keep alive
  min_concurrent_agents: 1

  # ============================================================================
  # Resource Management Configuration
  # ============================================================================

  # CPU usage threshold (percent) - trigger throttling if exceeded
  cpu_threshold: 80.0

  # Memory usage threshold (percent) - trigger throttling if exceeded
  memory_threshold: 70.0

  # Maximum open file descriptors per agent before alerting
  max_open_files_threshold: 1000

  # ============================================================================
  # Queue Management Configuration
  # ============================================================================

  # Maximum number of items a single agent can claim per phase
  max_claimed_per_agent: 5

  # Backpressure threshold - stop accepting new work if claimed items exceed this
  backpressure_claimed_threshold: 10

  # ============================================================================
  # Restart Backoff Configuration
  # ============================================================================

  # Exponential backoff delays for restart attempts (seconds)
  # Attempt 1: 2s, Attempt 2: 4s, Attempt 3: 8s, Attempt 4+: 16s
  restart_backoff:
    - 2
    - 4
    - 8
    - 16

  # ============================================================================
  # Logging Configuration
  # ============================================================================

  # Path to controller log file
  log_file: ".claude/swarm_controller.log"

  # Path to controller state file (JSON)
  state_file: ".claude/swarm_state.json"

  # Path to AGENTS_ACTIVE.md (for publishing status)
  agents_active_file: "docs/reference/AGENTS_ACTIVE.md"

  # Path to WORK_STREAM.md (for queue depth monitoring)
  work_stream_file: "docs/reference/WORK_STREAM.md"

# ============================================================================
# Healing Policies
# ============================================================================
# These define how the controller responds to detected issues.

healing:
  # On resource pressure (CPU >80% or Memory >70%):
  # 1. Pause low-priority agents (SIGSTOP)
  # 2. Wait for resource recovery
  # 3. Resume agents (SIGCONT)
  on_resource_pressure:
    action: "pause"  # or "kill" (last resort)
    max_paused: 2    # max agents to pause

  # On stale agent (no heartbeat > 30s):
  # 1. Check if process still alive
  # 2. Try to resume if paused
  # 3. Escalate to manual if still dead
  on_stale_agent:
    action: "check_and_resume"
    escalate_after: 60  # seconds

  # On SLO breach:
  # 1. Log warning
  # 2. Continue monitoring
  # 3. Escalate after 3 breaches
  on_slo_breach:
    max_breaches: 3
    escalate_after: 300  # seconds

  # On unrecoverable failure:
  # 1. Stop auto-restart attempts
  # 2. Log error
  # 3. Alert L1 team
  on_max_restarts:
    action: "escalate"
    alert_method: "log"  # or "email", "slack", etc.

# ============================================================================
# Scaling Policies
# ============================================================================
# These control how the swarm scales up/down based on demand.

scaling:
  # How aggressive to scale up (number of agents to add per decision)
  scale_up_increment: 1

  # How conservative to scale down (number of agents to remove per decision)
  scale_down_increment: 1

  # Cooldown between scaling decisions (seconds)
  scaling_cooldown: 30

  # Only scale up if CPU <60% and Memory <50%
  scale_up_when_cpu_below: 60.0
  scale_up_when_memory_below: 50.0

# ============================================================================
# Alerts and Notifications
# ============================================================================
# Configure how the controller alerts on critical events.

alerts:
  # Alert when agent restart count exceeds threshold
  restart_threshold: 2

  # Alert when error count exceeds threshold
  error_threshold: 5

  # Alert when resource pressure sustained for N cycles
  resource_pressure_cycles: 5

  # Alert channels (not yet implemented, for future use)
  channels:
    - type: "log"
      level: "ERROR"
    # - type: "slack"
    #   webhook_url: "https://hooks.slack.com/..."
    # - type: "email"
    #   recipients: ["ops@example.com"]

# ============================================================================
# Development / Debug Mode
# ============================================================================

debug:
  # Enable verbose logging
  verbose: false

  # Dry-run mode: log decisions but don't execute
  dry_run: false

  # Write detailed metrics to log on every cycle
  detailed_metrics: false
