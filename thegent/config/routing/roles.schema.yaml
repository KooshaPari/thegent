# Helios Router — Role definitions (chatgpt4 §6)
# Per-role hard constraints + soft order + output_tokens_pred multiplier

schema_version: 1
description: Router profiles for Pareto selection

roles:
  fast_chat:
    hard:
      p95_latency_ms: 1500
      min_quality: 0.5
    soft_order: [speed, cost, quality]
    output_tokens_multiplier: 0.8
    benchmark_weights:
      instruction_following: 0.5
      coherence: 0.3
      safety: 0.2

  doc_writer:
    hard:
      min_context_tokens: 32000
      min_quality: 0.78
    soft_order: [quality, cost, speed]
    output_tokens_multiplier: 1.8
    benchmark_weights:
      writing_eval: 0.4
      instruction_following: 0.3
      long_context: 0.3

  code_complex:
    hard:
      needs_tools: true
      min_quality: 0.75
      min_context_tokens: 32000
    soft_order: [quality, cost, speed]
    output_tokens_multiplier: 1.2
    benchmark_weights:
      coding: 0.5
      reasoning: 0.3
      tool_use: 0.2

  high_accuracy:
    hard:
      min_quality: 0.9
      min_context_tokens: 64000
    soft_order: [quality, speed, cost]
    output_tokens_multiplier: 1.0
    benchmark_weights:
      coding: 0.4
      reasoning: 0.4
      tool_use: 0.2

  # Default when role unknown
  default:
    hard:
      min_quality: 0.6
    soft_order: [quality, cost, speed]
    output_tokens_multiplier: 1.0
    benchmark_weights:
      instruction_following: 0.5
      coherence: 0.5
