# qgate configuration for thegent.
#
# Adopted via the "1 via 2" protocol (gate-first-red-then-backfill).
# `continue-on-error: true` in the workflow until per-module coverage
# reaches the threshold — flip to blocking once backfilled.

coverage_threshold = 70.0

# lcov generated by cargo-llvm-cov (Rust) + nyc (TypeScript) in the workflow.
coverage_path = "coverage/lcov.info"
coverage_format = "lcov"

# thegent: Rust hexagonal (core) + TS (SDK, browser).
# Has a11y + e2e tests (playwright), published OpenAPI spec.
# Mutation testing is wired (nightly via cargo-mutants for Rust).
not_applicable = [
]
