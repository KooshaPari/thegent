# Bounded Contexts Configuration
# Maps agents to DDD-style bounded contexts for the gardener system
# Based on research: CrewAI roles, LangGraph nodes, DDD bounded contexts

# Context definitions with agents
contexts:
  qa:
    description: "Quality assurance and testing"
    hunger_types:
      - test_coverage
      - lint_violations
    agents:
      - qa-test-coverage-expert
      - test-strategist
      - api-testing-specialist
      - accessibility-testing-expert

  docs:
    description: "Documentation and knowledge management"
    hunger_types:
      - doc_disorganization
    agents:
      - code-documentor
      - knowledge-base-curator

  research:
    description: "Research and exploration"
    hunger_types:
      - fragmented_research
    agents:
      - product-research-analyst
      - research-scout

  governance:
    description: "Governance and policy enforcement"
    hunger_types:
      - missing_specs
      - stale_items
      - agent_failure
    agents:
      - quality-gatekeeper
      - compliance-liaison
      - configuration-auditor
      - security-auditor

  code:
    description: "Implementation and coding"
    hunger_types:
      - technical_debt
    agents:
      - wbs-task-executor
      - code-review-refactor-expert
      - backlog-gardener
      - plan-decomposer

  planning:
    description: "Planning and orchestration"
    agents:
      - product-orchestrator
      - plan-orchestrator
      - portfolio-flow-planner
      - software-planning-architect

  infrastructure:
    description: "Infrastructure and operations"
    agents:
      - ops-concierge
      - build-track-coordinator
      - outcome-evaluator

  safety:
    description: "Safety and reliability"
    agents:
      - dependency-risk-manager
      - observability-sentinel
      - release-readiness-officer

# Context communication protocols
protocols:
  qa_to_code:
    - "test:coverage_report"
    - "test:recommendations"

  docs_to_research:
    - "doc:context_update"

  governance_to_code:
    - "policy:enforce"
    - "policy:violation"

  code_to_infrastructure:
    - "deploy:ready"
    - "infra:required"

# Handoff protocols
handoffs:
  research_to_planning:
    input: "research_findings"
    output: "plan_proposal"

  planning_to_code:
    input: "approved_spec"
    output: "implementation"

  code_to_qa:
    input: "implementation_complete"
    output: "test_requirements"

  qa_to_governance:
    input: "quality_report"
    output: "approval_decision"

# Parallel execution groups (agents that can run simultaneously)
parallel_groups:
  - name: "research_parallel"
    contexts: ["research", "planning"]
    max_concurrent: 3

  - name: "quality_parallel"
    contexts: ["qa", "governance"]
    max_concurrent: 2
