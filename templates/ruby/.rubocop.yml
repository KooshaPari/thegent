# RuboCop Configuration for Ruby
# Based on: rubocop.readthedocs.io + Ruby Style Guide

AllCops:
  NewCops: enable
  SuggestExtensions:
    rubocop-rails: true
    rubocop-rspec: true
  Exclude:
    - 'node_modules/**'
    - 'vendor/**'
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'bin/bundle'
    - 'tmp/**'

# Layout
Layout/LineLength:
  Max: 100
Layout/IndentationWidth:
  Width: 2
Layout/FirstHashElementLineBreak:
  Enabled: true
Layout/MultilineHashKeyLineBreak:
  Enabled: true
Layout/ParameterAlignment:
  EnforcedStyle: fixed

# Naming
Naming/AccessorMethodPrefix:
  Enabled: false
Naming/FileName:
  Exclude:
    - 'Rakefile'
    - 'Gemfile'
Naming/HeredocDelimiterCase:
  Enabled: true
Naming/HeredocDelimiterNaming:
  Enabled: true

# Style
Style/AsciiComments:
  Enabled: false
Style/ClassAndModuleChildren:
  Enabled: false
Style/CollectionMethods:
  PreferredMethods:
    inject: "inject"
    reduce: "reduce"
Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: true
Style/Lambda:
  Enabled: false
Style/MethodDefParentheses:
  Enabled: true
Style/OptionalArguments:
  Enabled: false
Style/PercentLiteralDelimiters:
  Enabled: true
Style/SymbolProc:
  Enabled: false
Style/WordArray:
  Enabled: false
Style/ZeroLengthPredicate:
  Enabled: true

# Metrics
Metrics/AbcSize:
  Max: 20
Metrics/BlockLength:
  Max: 30
Metrics/ClassLength:
  Max: 200
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/MethodLength:
  Max: 20
Metrics/ParameterLists:
  Max: 5

# RSpec
RSpec/AnyInstance:
  Enabled: false
RSpec/BeNil:
  Enabled: true
RSpec/DescribeMethod:
  Enabled: false
RSpec/ExampleLength:
  Max: 10
RSpec/ExpectInHook:
  Enabled: false
RSpec/FactoryBot:
  Enabled: true
RSpec/FeatureKnowlege:
  Enabled: false
RSpec/HookArgument:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/MessageSpies:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/NamedSubject:
  Enabled: false
RSpec/NestedGroups:
  MaxTopLevelGroups: 10
RSpec/VerifiedDoubles:
  Enabled: false
