# Clippy Configuration for Rust
# Based on: rust-lang/rust-clippy docs + industry best practices (2026)
# Place in: project root as .clippy.toml OR in Cargo.toml

[clippy]
# Enable specific categories (recommended over all = true)
cognitive-complexity = "warn"
collapsible-if = "warn"
large-types = "warn"
literal-representation = "warn"
mut-mut = "warn"
ptr-arg = "warn"
significant-drop-in-scrutinee = "warn"
unnecessary-struct-initialization = "warn"

# Performance lints
large-constexpr-loops = "warn"
vec-box = "warn"

# Style lints
decimal-literal-representation = "warn"
implied-bound-in-match-arms = "warn"
inconsistent-struct-constructor = "warn"
manual-clone = "warn"
needless-return = "warn"
redundant-field-names = "warn"
semicolon-if-nothing-returned = "warn"
unnecessary-cast = "warn"

# Pedantic lints (detailed control)
cast-precision-loss = "warn"
checked-conversions = "warn"
explicit-iter-loop-deref-inside = "warn"
float-equal = "warn"
from-over-for = "warn"
implicit-clone = "warn"
inline-always = "warn"
iter-on-zero-sized-zero = "warn"
map-unwrap-or = "warn"
or-fun-call = "warn"
result-map-unit-fn = "warn"
type-complexity = "warn"
unused-async = "warn"

# Disallow (strict)
disallow = [
    "clippy::todo",
    "clippy::unwrap_used",
    "clippy::expect_used",
    "clippy::panic",
]

# Type complexity
type-complexity-threshold = 250
single-char-binding-names-threshold = 4

# MSRV
msrv = "1.70"

# --- Usage ---
# Option 1: In Cargo.toml
# [workspace.metadata.clippy]
# config = ".clippy.toml"

# Option 2: Run with
# cargo clippy --config-path .clippy.toml
