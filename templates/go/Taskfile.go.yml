version: '3'

vars:
  GO_PKG: '{{.GO_PKG | default "./..."}}'

tasks:
  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run {{.GO_PKG}}

  format:
    desc: Format with gofumpt
    cmds:
      - gofumpt -l -w .

  test:
    desc: Run tests
    cmds:
      - go test -race -count=1 {{.GO_PKG}}

  test:cov:
    desc: Run tests with coverage
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic {{.GO_PKG}}
      - go tool cover -func=coverage.out

  security:
    desc: Run security checks
    cmds:
      - gosec {{.GO_PKG}}
      - govulncheck {{.GO_PKG}}

  dead-code:
    desc: Check for dead code
    cmds:
      - deadcode {{.GO_PKG}}

  build:
    desc: Build project
    cmds:
      - go build {{.GO_PKG}}

  all:
    desc: Run all Go quality checks
    deps: [lint, test:cov, security]
