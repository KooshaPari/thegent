[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "W",       # pycodestyle
  "F",             # pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "S",             # bandit (security)
  "B",             # bugbear
  "A",             # builtins shadowing
  "C4",            # comprehensions
  "DTZ",           # datetime timezone
  "T20",           # print statements
  "SIM",           # simplify
  "TCH",           # type checking imports
  "RUF",           # ruff-specific
  "PT",            # pytest style
  "ERA",           # commented-out code
  "PL",            # pylint subset
  "PERF",          # performance
  "FURB",          # refurb
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["${PROJECT_NAME}"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration", "slow"]
addopts = "-q --strict-markers --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
