version: '3'

vars:
  TS_SRC: '{{.TS_SRC | default "src"}}'
  PKG_MGR: '{{.PKG_MGR | default "bun"}}'

tasks:
  lint:
    desc: Run oxlint
    cmds:
      - npx oxlint {{.TS_SRC}}

  format:
    desc: Format with prettier
    cmds:
      - npx prettier --write {{.TS_SRC}}

  format:check:
    desc: Check formatting
    cmds:
      - npx prettier --check {{.TS_SRC}}

  typecheck:
    desc: Run TypeScript type checker
    cmds:
      - npx tsc --noEmit

  test:
    desc: Run tests
    cmds:
      - "{{.PKG_MGR}} test"

  test:cov:
    desc: Run tests with coverage
    cmds:
      - npx vitest run --coverage

  build:
    desc: Build project
    cmds:
      - "{{.PKG_MGR}} run build"

  dead-code:
    desc: Check for dead exports
    cmds:
      - npx knip --no-progress

  all:
    desc: Run all TS quality checks
    deps: [lint, format:check, typecheck, test:cov]
