# pre-commit config — fast checks + suppression blocker
# Copy to project .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.10.0
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-shellcheck
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--enable=all"]

  - repo: local
    hooks:
      - id: suppression-blocker
        name: Block new lint suppressions
        entry: bash -c 'git diff --cached --diff-filter=ACM -U0 | grep -E "^\+" | grep -cE "(# noqa|# type: ignore|// eslint-disable|@ts-ignore|//nolint|#\[allow\()" && echo "ERROR: New lint suppressions detected. Fix the code instead." && exit 1 || exit 0'
        language: system
        types: [text]
        stages: [pre-commit]
