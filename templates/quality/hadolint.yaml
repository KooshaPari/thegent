# Strict Hadolint configuration for Dockerfiles
failure-threshold: warning
no-fail: false
trusted-registries:
  - docker.io
  - ghcr.io
  - gcr.io
  - quay.io
ignored: []
override:
  error:
    - DL3000  # Use absolute WORKDIR
    - DL3001  # No pipe to install commands
    - DL3002  # Do not switch to root USER
    - DL3003  # Use WORKDIR
    - DL3004  # Do not use sudo
    - DL3006  # Always tag the version
    - DL3007  # Use specific tag, not latest
    - DL3008  # Pin versions in apt-get
    - DL3009  # Delete apt-get lists
    - DL3010  # Use ADD for archives
    - DL3011  # Valid UNIX ports only
    - DL3013  # Pin pip versions
    - DL3015  # Avoid additional apt packages
    - DL3016  # Pin npm versions
    - DL3018  # Pin apk versions
    - DL3019  # Use --no-cache for apk
    - DL3020  # Use COPY instead of ADD
    - DL3025  # Use JSON for CMD
    - DL3027  # Do not use apt
    - DL3028  # Pin gem versions
    - DL3059  # Multiple consecutive RUN
    - DL4006  # Set SHELL pipefail
    - SC2086  # Quote variable expansions
