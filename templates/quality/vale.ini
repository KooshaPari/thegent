# Strict Vale prose linter configuration
StylesPath = styles
MinAlertLevel = suggestion

Vocab = project

[*.md]
BasedOnStyles = Vale, Microsoft, Google

# Core rules
Vale.Spelling = YES
Vale.Terms = YES

# Microsoft style
Microsoft.Accessibility = error
Microsoft.Adverbs = warning
Microsoft.ComplexWords = warning
Microsoft.Contractions = suggestion
Microsoft.DateFormat = error
Microsoft.DateOrder = error
Microsoft.FirstPerson = warning
Microsoft.Foreign = warning
Microsoft.GenderBias = error
Microsoft.HeadingAcronyms = warning
Microsoft.HeadingColons = error
Microsoft.HeadingPunctuation = error
Microsoft.Hyphens = warning
Microsoft.OxfordComma = warning
Microsoft.Passive = warning
Microsoft.Ranges = error
Microsoft.Semicolon = warning
Microsoft.SentenceLength = warning
Microsoft.URLFormat = error
Microsoft.Vocab = warning
Microsoft.We = warning
Microsoft.Wordiness = warning

# Google developer docs style
Google.DateFormat = error
Google.Ellipses = warning
Google.EmDash = warning
Google.Exclamation = error
Google.FirstPerson = warning
Google.Gender = error
Google.Headings = error
Google.Latin = warning
Google.LyHyphens = warning
Google.OptionalPlurals = warning
Google.Ordinal = warning
Google.OxfordComma = warning
Google.Parens = warning
Google.Passive = warning
Google.Periods = error
Google.Quotes = warning
Google.Semicolons = warning
Google.Spacing = error
Google.Spelling = warning
Google.Will = warning
Google.WordList = warning
Google.Units = error

[*.txt]
BasedOnStyles = Vale

[*.rst]
BasedOnStyles = Vale, Microsoft
