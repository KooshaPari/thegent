# Process-Compose Template for Python/FastAPI Backends
#
# This template defines standard services for Python-based backend deployments.
# Includes: API server, async workers, optional gRPC service.
#
# USAGE:
#   1. Start with process-compose.base.yaml
#   2. Append or include this file for Python backend services
#   3. Customize environment, ports, and dependencies as needed
#
# EXTENDS: process-compose.base.yaml
# DEPENDENCIES: Python 3.11+ with FastAPI, uvicorn, asyncio
#
# Port Assignments:
#   - API (HTTP): 8000 (default)
#   - gRPC: 9092 (default)
#   - Workers: internal, no exposed port

version: "0.5"

environment:
  - PYTHONUNBUFFERED=1
  - PYTHONPATH=src
  - DEBUG=${DEBUG:-false}

processes:

  #############################################################################
  # API Server: FastAPI/uvicorn on port 8000
  #############################################################################
  # Standard HTTP API backend with hot reload (--reload).
  # Health endpoint: GET /health
  # Depends on: infrastructure (database, cache, etc.)
  # Log: .process-compose/logs/api.log

  api:
    command: |
      python -m uvicorn \
        app:app \
        --host 0.0.0.0 \
        --port 8000 \
        --reload
    working_dir: .
    availability:
      restart: on_failure
      max_restarts: 5
      backoff_seconds: 2
    readiness_probe:
      http_get:
        host: localhost
        port: 8000
        path: /health
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    log_location: .process-compose/logs/api.log
    environment:
      - "PORT=8000"
      - "DEBUG=false"
      - "WORKERS=4"

  #############################################################################
  # Background Worker: Async task processor
  #############################################################################
  # Processes background jobs (async tasks, scheduled jobs, etc.).
  # Example: Celery, RQ, or custom asyncio worker.
  # Depends on: queue (Redis, Kafka), database
  # Log: .process-compose/logs/worker.log

  worker:
    command: |
      python -m celery \
        -A app.celery_app \
        worker \
        --loglevel=info \
        --concurrency=4
    working_dir: .
    availability:
      restart: on_failure
      max_restarts: 5
      backoff_seconds: 2
    readiness_probe:
      exec:
        command: sh
        args: ["-c", "ps aux | grep -q '[c]elery worker' || exit 1"]
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    log_location: .process-compose/logs/worker.log
    environment:
      - "WORKERS=4"
      - "TASK_TIMEOUT=300"

  #############################################################################
  # Optional: Scheduled Task Runner (e.g., APScheduler, Celery Beat)
  #############################################################################
  # Runs periodic/scheduled tasks.
  # Depends on: worker
  # Log: .process-compose/logs/scheduler.log

  scheduler:
    command: |
      python -m celery \
        -A app.celery_app \
        beat \
        --loglevel=info
    working_dir: .
    availability:
      restart: on_failure
      max_restarts: 3
      backoff_seconds: 2
    readiness_probe:
      exec:
        command: sh
        args: ["-c", "ps aux | grep -q '[c]elery beat' || exit 1"]
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    log_location: .process-compose/logs/scheduler.log

  #############################################################################
  # Optional: gRPC Service (if your backend has gRPC endpoints)
  #############################################################################
  # Separate gRPC server (port 9092) for high-performance inter-service communication.
  # Depends on: database, cache
  # Log: .process-compose/logs/grpc.log

  grpc-server:
    command: |
      python -m grpc_server \
        --port 9092 \
        --host 0.0.0.0
    working_dir: .
    availability:
      restart: on_failure
      max_restarts: 5
      backoff_seconds: 2
    readiness_probe:
      exec:
        command: sh
        args: ["-c", "nc -z localhost 9092 || exit 1"]
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    log_location: .process-compose/logs/grpc.log
    environment:
      - "GRPC_PORT=9092"

  #############################################################################
  # Optional: Data Migration Service (runs once at startup)
  #############################################################################
  # Runs database migrations before API starts.
  # Depends on: database (healthy)
  # Log: .process-compose/logs/migrations.log

  migrations:
    command: |
      python -m alembic upgrade head
    working_dir: .
    availability:
      restart: no   # Only run once; don't restart on failure
    readiness_probe:
      exec:
        command: sh
        args: ["-c", "test -f .migrations-complete || exit 1"]
      initial_delay_seconds: 5
      period_seconds: 5
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 1
    log_location: .process-compose/logs/migrations.log
    environment:
      - "ALEMBIC_CONFIG=alembic.ini"

  #############################################################################
  # Optional: Cache Prewarmer (runs once after API is healthy)
  #############################################################################
  # Pre-populates caches to reduce cold-start latency.
  # Depends on: API (healthy), cache (healthy)
  # Log: .process-compose/logs/cache-prewarmer.log

  cache-prewarmer:
    command: |
      python -c "from app.cache import preload_all; preload_all()"
    working_dir: .
    availability:
      restart: no   # Only run once
    readiness_probe:
      exec:
        command: sh
        args: ["-c", "test -f .cache-prewarmed || exit 1"]
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    log_location: .process-compose/logs/cache-prewarmer.log
    depends_on:
      api:
        condition: process_healthy

#############################################################################
# REFERENCE: Standard Environment Variables
#############################################################################
#
# DEBUG: Set to 'true' for development (enables verbose logging, auto-reload)
# WORKERS: Number of concurrent workers (default: 4)
# TASK_TIMEOUT: Background task timeout in seconds (default: 300)
# DATABASE_URL: Connection string (e.g., postgresql://user:pass@localhost/db)
# REDIS_URL: Redis connection string (e.g., redis://localhost:6379)
# LOG_LEVEL: Logging level (DEBUG, INFO, WARNING, ERROR) (default: INFO)
#
#############################################################################
# REFERENCE: Health Check Patterns
#############################################################################
#
# FastAPI HTTP endpoint:
#   @app.get("/health")
#   def health():
#       return {"status": "ok"}
#
# Celery worker readiness:
#   ps aux | grep '[c]elery worker'
#
# gRPC port check:
#   nc -z localhost 9092
#
#############################################################################
