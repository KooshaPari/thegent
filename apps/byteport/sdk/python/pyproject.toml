[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byteport"
version = "1.0.0"
description = "BytePort SDK for Python - Deploy anything, anywhere with zero cost"
authors = [{name = "BytePort Team", email = "team@byteport.io"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["byteport", "deployment", "cloud", "serverless", "zero-cost"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
async = ["aiofiles>=23.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://byteport.io"
Documentation = "https://docs.byteport.io"
Repository = "https://github.com/byteport/sdk-python"
Issues = "https://github.com/byteport/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["byteport"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
