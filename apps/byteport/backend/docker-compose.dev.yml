version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: byteport-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://byteport:byteport@postgres:5432/byteport?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - byteport
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: byteport-postgres
    ports:
      - "54321:5432"  # Non-standard port to avoid conflicts
    environment:
      POSTGRES_USER: byteport
      POSTGRES_PASSWORD: byteport
      POSTGRES_DB: byteport
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byteport"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - byteport

  redis:
    image: redis:7-alpine
    container_name: byteport-redis
    ports:
      - "63790:6379"  # Non-standard port to avoid conflicts
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - byteport

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: byteport-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@byteport.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - byteport
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  byteport:
    driver: bridge
