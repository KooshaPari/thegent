name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-tests:
    name: PR Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better diff analysis

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: backend/api/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: |
          cd backend/api && go mod download
          cd ../../frontend/web-next && pnpm install --frozen-lockfile

      - name: Detect changed files
        id: changes
        run: |
          echo "backend=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^backend/' | wc -l)" >> $GITHUB_OUTPUT
          echo "frontend=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^frontend/' | wc -l)" >> $GITHUB_OUTPUT

      - name: Run backend tests
        if: steps.changes.outputs.backend > 0
        working-directory: backend/api
        run: |
          export GOCACHE=$(pwd)/.gocache
          export GOMODCACHE=$(pwd)/.gomodcache
          go test -v -race -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt
          echo "BACKEND_TESTS_RAN=true" >> $GITHUB_ENV

      - name: Run frontend tests
        if: steps.changes.outputs.frontend > 0
        working-directory: frontend/web-next
        run: |
          pnpm test:run 2>&1 | tee test-output.txt
          echo "FRONTEND_TESTS_RAN=true" >> $GITHUB_ENV

      - name: Calculate test coverage
        id: coverage
        run: |
          if [ "$BACKEND_TESTS_RAN" = "true" ]; then
            BACKEND_COV=$(go tool cover -func=backend/api/coverage.out | grep total | awk '{print $3}')
            echo "backend_coverage=$BACKEND_COV" >> $GITHUB_OUTPUT
          fi
          
          if [ "$FRONTEND_TESTS_RAN" = "true" ]; then
            # Extract coverage from frontend
            echo "frontend_coverage=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with test results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🧪 Test Results\n\n';
            
            if (process.env.BACKEND_TESTS_RAN === 'true') {
              comment += '### Backend Tests\n';
              comment += '✅ Backend tests passed\n';
              if (process.env.backend_coverage) {
                comment += `📊 Coverage: ${process.env.backend_coverage}\n`;
              }
              comment += '\n';
            }
            
            if (process.env.FRONTEND_TESTS_RAN === 'true') {
              comment += '### Frontend Tests\n';
              comment += '✅ Frontend tests passed\n\n';
            }
            
            if (process.env.BACKEND_TESTS_RAN !== 'true' && process.env.FRONTEND_TESTS_RAN !== 'true') {
              comment += '⚠️ No test changes detected\n';
            }
            
            comment += '\n---\n';
            comment += '*Automated test report for PR #' + context.issue.number + '*';
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🧪 Test Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  quick-lint:
    name: Quick Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install frontend dependencies
        working-directory: frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend/web-next
        run: pnpm lint

      - name: Check TypeScript
        working-directory: frontend/web-next
        run: pnpm tsc --noEmit
