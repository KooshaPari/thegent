name: Quality Gates & Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.21'
  PNPM_VERSION: '8'

jobs:
  # ============================================================================
  # CODE QUALITY & LINTING
  # ============================================================================
  
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: ./frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (Strict)
        working-directory: ./frontend/web-next
        run: |
          pnpm eslint . --ext .ts,.tsx --config .eslintrc.strict.json --max-warnings 0

      - name: Run Prettier Check
        working-directory: ./frontend/web-next
        run: pnpm prettier --check "**/*.{ts,tsx,json,md}"

      - name: TypeScript Type Check (Strict)
        working-directory: ./frontend/web-next
        run: pnpm tsc --noEmit --strict

      - name: Check for unused dependencies
        working-directory: ./frontend/web-next
        run: |
          npx depcheck --ignores="@types/*,eslint-*,prettier-*,vitest,@playwright/*"

  # ============================================================================
  # BACKEND QUALITY & TESTS
  # ============================================================================
  
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: byteport_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/api/go.sum

      - name: Go Format Check
        working-directory: ./backend/api
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go files must be formatted with gofmt -s"
            gofmt -s -d .
            exit 1
          fi

      - name: Go Vet
        working-directory: ./backend/api
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: backend/api
          args: --timeout=5m

      - name: Run Go Tests with Coverage
        working-directory: ./backend/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/byteport_test?sslmode=disable
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out -o coverage.txt

      - name: Check Backend Coverage >= 85%
        working-directory: ./backend/api
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Backend Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 85" | bc -l) )); then
            echo "❌ Backend coverage ${COVERAGE}% is below 85% threshold"
            exit 1
          fi
          echo "✅ Backend coverage ${COVERAGE}% meets 85% threshold"

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/api/coverage.out
          flags: backend
          name: backend-coverage

  # ============================================================================
  # FRONTEND UNIT & INTEGRATION TESTS
  # ============================================================================
  
  frontend-tests:
    name: Frontend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests with Coverage
        working-directory: ./frontend/web-next
        run: pnpm test:coverage

      - name: Check Frontend Coverage >= 85%
        working-directory: ./frontend/web-next
        run: |
          # Parse coverage from Vitest output
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')
          echo "Frontend Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 85" | bc -l) )); then
            echo "❌ Frontend coverage ${COVERAGE}% is below 85% threshold"
            exit 1
          fi
          echo "✅ Frontend coverage ${COVERAGE}% meets 85% threshold"

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/web-next/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # ============================================================================
  # E2E TESTS
  # ============================================================================
  
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: ./frontend/web-next
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run E2E Tests
        working-directory: ./frontend/web-next
        env:
          CI: true
        run: pnpm test:e2e

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: frontend/web-next/playwright-report/
          retention-days: 30

      - name: Upload E2E Test Videos
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-videos
          path: frontend/web-next/test-results/
          retention-days: 7

  # ============================================================================
  # VISUAL REGRESSION TESTING
  # ============================================================================
  
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        working-directory: ./frontend/web-next
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Visual Tests
        working-directory: ./frontend/web-next
        run: pnpm test:visual

      - name: Upload Visual Diffs
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: visual-diffs
          path: frontend/web-next/test-results/visual-diffs/
          retention-days: 7

  # ============================================================================
  # PERFORMANCE TESTING
  # ============================================================================
  
  performance-tests:
    name: Performance & Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Build Application
        working-directory: ./frontend/web-next
        run: pnpm build

      - name: Analyze Bundle Size
        working-directory: ./frontend/web-next
        run: |
          npx @next/bundle-analyzer

      - name: Check Bundle Size Limits
        working-directory: ./frontend/web-next
        run: |
          npx bundlewatch --config bundlewatch.config.json

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/deployments
          configPath: './frontend/web-next/lighthouserc.json'
          uploadArtifacts: true

  # ============================================================================
  # MUTATION TESTING
  # ============================================================================
  
  mutation-testing:
    name: Mutation Testing (Test Quality)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Run Stryker Mutation Tests
        working-directory: ./frontend/web-next
        run: pnpm test:mutation

      - name: Upload Mutation Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mutation-report
          path: frontend/web-next/reports/mutation/
          retention-days: 30

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  
  security-scan:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (Frontend)
        working-directory: ./frontend/web-next
        run: |
          pnpm audit --audit-level=moderate || true

      - name: Run Go Security Scan
        uses: securego/gosec@master
        with:
          args: ./backend/api/...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e # pinned from @master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # FINAL QUALITY GATE
  # ============================================================================
  
  quality-gate:
    name: Final Quality Gate ✅
    runs-on: ubuntu-latest
    needs: [code-quality, backend-quality, frontend-tests, e2e-tests, visual-regression, performance-tests]
    if: always()
    steps:
      - name: Check All Jobs Status
        run: |
          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Code quality checks failed"
            exit 1
          fi
          if [[ "${{ needs.backend-quality.result }}" != "success" ]]; then
            echo "❌ Backend quality checks failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.visual-regression.result }}" != "success" ]]; then
            echo "⚠️  Visual regression tests had issues (non-blocking)"
          fi
          if [[ "${{ needs.performance-tests.result }}" != "success" ]]; then
            echo "⚠️  Performance tests had issues (non-blocking)"
          fi
          echo "✅ All critical quality gates passed!"
          echo "🎉 Code is ready for deployment!"

      - name: Post Summary
        run: |
          echo "## Quality Gates Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-quality.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Tests | ${{ needs.visual-regression.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
