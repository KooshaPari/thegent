name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  backend-tests:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: byteport
          POSTGRES_PASSWORD: byteport_test
          POSTGRES_DB: byteport_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/api/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            backend/api/.gocache
            backend/api/.gomodcache
          key: ${{ runner.os }}-go-${{ hashFiles('backend/api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: backend/api
        run: |
          export GOCACHE=$(pwd)/.gocache
          export GOMODCACHE=$(pwd)/.gomodcache
          go mod download
          go mod verify

      - name: Run backend tests
        working-directory: backend/api
        env:
          DATABASE_URL: postgres://byteport:byteport_test@localhost:5432/byteport_test?sslmode=disable
          GOCACHE: ${{ github.workspace }}/backend/api/.gocache
          GOMODCACHE: ${{ github.workspace }}/backend/api/.gomodcache
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/api/coverage.out
          flags: backend
          name: backend-coverage

      - name: Generate test report
        if: always()
        working-directory: backend/api
        run: |
          go test -v ./... 2>&1 | tee test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/api/test-results.txt

  frontend-tests:
    name: Frontend Tests (React/Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/web-next/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend/web-next
        run: pnpm test:run

      - name: Run frontend tests with coverage
        working-directory: frontend/web-next
        run: pnpm test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/web-next/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/web-next/coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        working-directory: frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend/web-next
        run: pnpm playwright install --with-deps chromium

      - name: Build application
        working-directory: frontend/web-next
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: pnpm build

      - name: Run E2E tests
        working-directory: frontend/web-next
        env:
          CI: true
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/web-next/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/web-next/test-results/

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        working-directory: frontend/web-next
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend/web-next
        run: pnpm lint

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: backend/api
          args: --timeout=5m

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, lint]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Determine overall status
        if: |
          needs.backend-tests.result != 'success' ||
          needs.frontend-tests.result != 'success' ||
          needs.e2e-tests.result != 'success' ||
          needs.lint.result != 'success'
        run: |
          echo "❌ Some tests failed"
          exit 1

      - name: Success message
        if: |
          needs.backend-tests.result == 'success' &&
          needs.frontend-tests.result == 'success' &&
          needs.e2e-tests.result == 'success' &&
          needs.lint.result == 'success'
        run: |
          echo "✅ All tests passed successfully!"
