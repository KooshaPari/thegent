name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          for f in $(find tools -name "*.sh" -type f 2>/dev/null); do
            shellcheck "$f" || true
          done

  makefile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Makefiles
        run: |
          for f in $(find tools -name "Makefile" -type f 2>/dev/null); do
            echo "Found Makefile: $f"
          done

  ci-cd-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CI/CD configs
        run: |
          for f in $(find tools/ci-cd -name "*.yml" -o -name "*.yaml" 2>/dev/null); do
            echo "Found CI/CD config: $f"
          done
