# Hook Execution Configuration
# This file defines smart execution rules for hooks based on file changes.
# Hooks will only run if relevant files have been modified.

# Global settings
settings:
  # Cache TTL in seconds (default: 600s = 10 min)
  cache_ttl: 600
  # Enable smart skip (default: true)
  smart_skip: true
  # Pre-warm caches on session start (default: true)
  prewarm_on_session_start: true
  # Parallel pipeline staging: run quality-gate in stages (default: true)
  parallel_stages: true
  # Speculative execution: pre-run tests after edits (default: true)
  speculative: true
  # Learning-based skip: skip hooks that consistently pass (default: false, opt-in)
  learning_skip: false
  # Coverage-based test selection: use imports + coverage for Python (default: true)
  coverage_based_selection: true
  # P6: Incremental analysis — skip files where only comments changed (default: true)
  incremental_analysis: true
  # P8: Background daemon — run watcher to pre-warm caches (default: false)
  daemon_mode: false
  # Phase 2 Rust hook runtime migration (default: false, opt-in)
  use_rust_runtime: true
  # Runtime binary for Rust migration mode
  rust_runtime_path: "thegent-hooks"
  # DEBUG: Log hook execution times (default: false)
  debug_timing: true
  # Timeout overrides (in seconds) for slow hooks - CAPPED for stop hooks
  timeout_overrides:
    quality-gate: 15       # CAPPED: was 300s
    task-completion: 15    # CAPPED: was 300s
    security-pipeline: 15   # CAPPED: was 600s
    agileplus-cycle: 10     # NEW: cap at 10s

# Hook-specific configuration
hooks:
  # Test maturity hook - only run if test files changed
  test-maturity:
    run_if: "(test|spec|tests|.*_test\\.|.*\\.test\\.)"
    timeout: 300
    description: "Assess project test maturity (only if test files changed)"

  # Task completion verifier - only run if source files changed
  task-completion:
    run_if: "\\.(py|rs|go|ts|js|sh|bash)$"
    timeout: 120
    description: "Verify task completion quality (only if source files changed)"

  # Quality gate - run on changed files only
  quality-gate:
    scope: changed
    timeout: 300
    description: "Run quality checks on changed files"

  # Security pipeline - run on changed + full lockfile checks
  security-pipeline:
    scope: changed
    timeout: 600
    description: "Security scanning (changed files + lockfiles)"

  # Complexity ratchet - only run on changed files
  complexity-ratchet:
    scope: changed
    timeout: 120
    description: "Check complexity on changed files only"

  # Spec verifier - skip unless FR file changed
  spec-verifier:
    run_if: "FUNCTIONAL_REQUIREMENTS\\.md$"
    timeout: 60
    description: "Verify spec-test linkage (only if FR file changed)"

  # Prune orphans - opt-in via THGENT_AUTO_PRUNE=1
  prune-orphans-stop:
    scope: all
    timeout: 30
    description: "Auto-prune redundant LSP/MCP processes when threshold exceeded"

  # Spotlight exclude on first SessionStart - opt-in via THGENT_SPOTLIGHT_EXCLUDE_ON_SESSION_START=1
  session-start-spotlight-exclude:
    scope: all
    timeout: 15
    description: "Run spotlight-exclude once per env (macOS) to reduce mds_stores"

  # Stop reconcile - always run (coordinates all hooks)
  stop-reconcile:
    scope: all
    timeout: 60
    description: "Coordinate stop hooks"

  # Teammate idle detection - run when teammate output received
  teammate-idle:
    scope: all
    timeout: 15
    description: "Detect if a teammate agent is idle and needs input"

  # Continuous work guard - keep agent working on backlog when idle
  continuous-work-guard:
    scope: all
    timeout: 10
    description: "Instruct agent to work on backlog items when idle"

  # Task completion hook - run when a task is finished
  task-completed:
    scope: all
    timeout: 15
    description: "Update task status in TeamManager when completed"

  # AgilePlus governance cycle - runs on Stop to maintain health
  agileplus-cycle:
    scope: all
    timeout: 600
    run_if: "\\.(py|sh|yaml|json)$"
    description: "Run AgilePlus governance cycle to maintain code health"

  # SCC Metrics - collect codebase stats
  scc-metrics:
    scope: all
    timeout: 30
    description: "Collect codebase metrics via scc"


# File patterns for change detection
patterns:
  test_files:
    - "(test|spec|tests|.*_test\\.|.*\\.test\\.)"
  source_files:
    - "\\.(py|rs|go|ts|js|tsx|jsx|sh|bash)$"
  docs_files:
    - "\\.(md|txt|rst)$"
  config_files:
    - "\\.(json|yaml|yml|toml|ini|cfg)$"
