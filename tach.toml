# Tach — module boundaries
# https://github.com/tach-org/tach
#
# Phase 4: MCP integration (2026-04-24)
# Enforces clean dependency boundaries:
# - thegent.core: Layer 0 (domain + ports) — NO dependencies
# - thegent.execution: Layer 1 (executor+planner+router) — depends on core ONLY
# - thegent.legacy: Layer 3 (god function isolation) — depends on core ONLY
# - thegent.mcp: Layer 3 (MCP server) — depends on core + execution + agents + models
# - CLI/Agents/Models: Layer 2+ — CANNOT import execution internally
#
# Key rule: execution module has ZERO imports from cli, agents, models, planning

source_roots = [ "src",]

exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.venv",
  "**/tests",
  "build",
  "dist",
  "docs",
]

exact = true
forbid_circular_dependencies = true
root_module = "ignore"

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

[[modules]]
path = "thegent.core"
depends_on = []

[[modules]]
path = "thegent.execution"
depends_on = []

[[modules]]
path = "thegent.legacy"
depends_on = []

[[modules]]
path = "thegent.agents"
depends_on = []

[[modules]]
path = "thegent.models"
depends_on = []

[[modules]]
path = "thegent.mcp"
depends_on = []

[[modules]]
path = "thegent.cli"
depends_on = []

[[modules]]
path = "thegent"
depends_on = []
