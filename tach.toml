# Tach Configuration — Architecture Enforcement
# https://github.com/tach-org/tach

source_roots = ["src"]

exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.venv",
  "**/tests",
  "build",
  "dist",
  "docs",
]

exact = true
forbid_circular_dependencies = false
root_module = "ignore"

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

[[modules]]
path = "thegent.config"
depends_on = []

[[modules]]
path = "thegent.exit_codes"
depends_on = []

[[modules]]
path = "thegent.output_parser"
depends_on = ["thegent.contracts", "thegent.config"]

[[modules]]
path = "thegent.contracts"
depends_on = ["thegent.output_parser", "thegent.config"]

[[modules]]
path = "thegent.models"
depends_on = ["thegent.config", "thegent.agents", "thegent.utils.routing_impl"]

[[modules]]
path = "thegent.execution"
depends_on = [ "thegent.contracts", "thegent.cli", "thegent.config"]

[[modules]]
path = "thegent.agents"
depends_on = ["thegent.config", "thegent.contracts", "thegent.observability", "thegent.cli", "thegent.execution", "thegent.utils.routing_impl"]

[[modules]]
path = "thegent.operations"
depends_on = []

[[modules]]
path = "thegent.orchestration_modes"
depends_on = []

[[modules]]
path = "thegent.planning"
depends_on = [ "thegent.models", "thegent.cli", "thegent.config", "thegent.observability", "thegent.execution"]

[[modules]]
path = "thegent.utils.routing_impl"
depends_on = []

[[modules]]
path = "thegent.observability"
depends_on = ["thegent.config"]

[[modules]]
path = "thegent.cli"
depends_on = [
    "thegent.config",
    "thegent.contracts",
    "thegent.models",
    "thegent.execution",
    "thegent.agents",
    "thegent.operations",
    "thegent.orchestration_modes",
    "thegent.planning",
    "thegent.exit_codes",
    "thegent.utils.routing_impl"
, "thegent.output_parser", "thegent.observability"]

[[modules]]
path = "thegent.mcp_server"
depends_on = []

# Track 4: Sub-project Split
# Phase 1: Infrastructure (P1.3)

# thegent-cli sub-project
[[modules]]
path = "thegent.cli.commands"
depends_on = ["thegent.config", "thegent.cli.parser"]

# thegent-agents sub-project  
[[modules]]
path = "thegent.agents.pool"
depends_on = ["thegent.config", "thegent.agents.executor"]

[[modules]]
path = "thegent.agents.executor"
depends_on = ["thegent.config", "thegent.contracts"]

# thegent-mcp sub-project
[[modules]]
path = "thegent.mcp.providers"
depends_on = ["thegent.config"]

[[modules]]
path = "thegent.mcp.tools"
depends_on = ["thegent.config", "thegent.mcp.providers"]

# Contracts module (new)
[[modules]]
path = "thegent.contracts.mcp"
depends_on = []

[[modules]]
path = "thegent.contracts.ipc"
depends_on = []

[[modules]]
path = "thegent.main"
depends_on = [
    "thegent.cli"
]
