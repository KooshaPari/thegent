[project]
name = "thegent-module-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "thegent-cli",
]

[tool.uv.sources]
thegent-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_app"]
