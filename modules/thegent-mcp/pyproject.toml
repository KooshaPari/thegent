[project]
name = "thegent-module-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "thegent-mcp",
]

[tool.uv.sources]
thegent-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_mcp_module"]
