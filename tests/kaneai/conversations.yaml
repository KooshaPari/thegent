# KaneAI-Style Conversation Testing for thegent
# Multi-turn conversation validation scenarios

name: "thegent Conversation Testing"
version: "1.0.0"

# Test scenarios for agent conversation behavior
scenarios:
  # Single-turn basic interaction
  - name: "agent_initialization"
    turns:
      - user: "Initialize agent with governance config"
        expected:
          - "Agent initialized"
          - "Governance rules loaded"
    
  # Multi-turn context preservation
  - name: "context_preservation"
    turns:
      - user: "Set context: project=nanoVMS"
        expected:
          - "Context set to nanoVMS"
      - user: "What project am I working on?"
        expected:
          - "nanoVMS"
      - user: "Create a feature branch"
        expected:
          - "Created feature branch for nanoVMS"
    
  # Error recovery in conversations
  - name: "error_recovery"
    turns:
      - user: "do something invalid"
        expected:
          - error: "Invalid command"
      - user: "help"
        expected:
          - "Available commands"
    
  # Multi-agent coordination
  - name: "multi_agent_coordination"
    turns:
      - user: "Forge: implement feature X"
        expected:
          - "Delegating to Muse for review"
      - user: "Muse: review the implementation"
        expected:
          - "Code review complete"

# Conversation validation rules
validation:
  context_window: 10
  max_turns: 50
  response_timeout_ms: 5000
  
# Test data generation
test_data:
  users:
    - id: "forge"
      role: "implementer"
    - id: "muse"
      role: "reviewer"
    - id: "sage"
      role: "researcher"
