name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Features'
    labels:
      - feature
      - enhancement
  - title: 'Fixes'
    labels:
      - fix
      - bug
      - bugfix
  - title: 'Maintenance'
    labels:
      - chore
      - docs
      - refactor
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
template: |
  ## What changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
exclude-labels:
  - skip-changelog
  - no-changelog
