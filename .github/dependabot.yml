version: 2
updates:
  # Root Python (uv.lock) — 11 alerts
  - package-ecosystem: pip
    directory: /
    schedule: {interval: daily}
    open-pull-requests-limit: 20
    groups:
      python-security:
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
        patterns: ["*"]

  # Root Cargo
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: daily}
    open-pull-requests-limit: 10

  # Byteport backend (Go) — 7 alerts
  - package-ecosystem: gomod
    directory: /apps/byteport/backend/api
    schedule: {interval: daily}
    open-pull-requests-limit: 20
    groups:
      go-security:
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
        patterns: ["*"]

  # Byteport frontend (npm) — 40+ alerts
  - package-ecosystem: npm
    directory: /apps/byteport/frontend/web-next
    schedule: {interval: daily}
    open-pull-requests-limit: 30
    groups:
      npm-security:
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
        patterns: ["*"]

  # Byteport docs (npm) — 4 alerts
  - package-ecosystem: npm
    directory: /apps/byteport/docs
    schedule: {interval: daily}
    open-pull-requests-limit: 10
    groups:
      docs-security:
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
        patterns: ["*"]

  # GitHub Actions (workflow security)
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
