name: ZAP DAST
permissions:
  contents: read
  pull-requests: read

on:
  push:
    paths:
      - '.github/workflows/backup/zap-dast.yml'
      - 'docs/**'
      - 'src/**'

jobs:
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install ZAP
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
          tar -xzf ZAP_2.17.0_Linux.tar.gz
          mv ZAP_2.17.0 zap
      - name: Run ZAP smoke scan
        run: |
          mkdir -p /tmp/zap-target
          printf '<!doctype html><title>thegent zap target</title><main>ok</main>\n' > /tmp/zap-target/index.html
          python3 -m http.server 8090 --directory /tmp/zap-target &
          target_pid=$!
          trap 'kill "$target_pid"' EXIT
          sleep 2
          zap/zap.sh \
            -cmd \
            -quickurl http://localhost:8090 \
            -quickout zap-report.html
