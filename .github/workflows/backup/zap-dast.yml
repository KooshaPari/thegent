name: ZAP DAST
permissions:
  contents: read
  pull-requests: read

on:
  push:
    paths:
      - 'docs/**'
      - 'src/**'

jobs:
  zap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install ZAP
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
          tar -xzf ZAP_2.17.0_Linux.tar.gz
          mv ZAP_2.17.0 zap
      - name: Run ZAP
        run: |
          zap/zap.sh \
            -cmd \
            -quickurl http://localhost:8080 \
            -quickout zap-report.html
