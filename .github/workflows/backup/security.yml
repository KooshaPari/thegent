name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  SKIP_QUOTA_INTENSIVE: ${{ github.event_name == 'pull_request' && github.event.pull_request additions <= 50 }}

jobs:
  # Secret Scanning (always runs - lightweight)
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact

  # License Compliance (using reuse-action - lightweight)
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip on PRs to save quota - run only on schedule
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Analyze licenses
        uses: fsfe/reuse-action@3ae3c6bdf1257ab19397fab11fd3312144692083
        continue-on-error: true  # Allow findings but don't fail

      - name: Check for non-reusable licenses
        run: |
          # Check for problematic licenses
          grep -r "GPL\|AGPL" --include="*.toml" --include="*.json" . || true

  # SAST Scanning (Layered - Semgrep primary, CodeQL backup)
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # Skip if no code changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Run ESLint Security
        run: npx eslint . --ext .ts,.tsx --config .eslintrc.security.js || true
        continue-on-error: true

      - name: Run Semgrep (Primary)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: |
            p/typescript
            p/security-audit
            p/secrets
          generateSarif: "1"
          sarifFile: "semgrep-results.sarif"
        continue-on-error: true  # Allow quota limits

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # CodeQL backup (only on schedule, not PRs - quota optimization)
      - name: Run CodeQL (Backup - schedule only)
        if: github.event_name == 'schedule'
        uses: github/codeql-action/analyze@v4
        with:
          languages: typescript
          category: "/language:typescript"

  # Dependency Vulnerability Scanning
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'  # Skip on PRs
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5


      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

  # Container Scanning (if Dockerfile exists)
  container:
    name: Container Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && hashFiles('Dockerfile') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build image
        run: docker build -t ${{ github.event.repository.name }}:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ github.event.repository.name }}:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
