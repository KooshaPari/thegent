name: Secrets Scan

# L27 Infrastructure lane — secrets-invariants static check.
#
# Runs `make secrets-scan` against every push + PR. The underlying
# script (scripts/check_secrets_invariants.sh) verifies:
#   * gitleaks.toml exists, parses, has [allowlist] + ≥5 custom rules
#   * trufflehog.yml exists and enables at least one detector
#   * .gitignore covers canonical secret-bearing artefacts
#   * No live-key pattern leaks in non-allowlisted tracked-tree paths
#
# Designed to run in <1s on Linux. The advisory live-key sniff is
# warn-only (gitleaks is the source of truth); all other checks are
# hard fails.

on:
  push:
    branches: [main, master, chore/**, feat/**, fix/**, refactor/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${ github.workflow }-${ github.ref }
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets invariants (L27)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install uv (used by the script for tomllib parsing)
        run: python -m pip install --upgrade pip "uv>=0.4.0"
      - name: Run secrets-scan
        run: bash scripts/check_secrets_invariants.sh
      - name: Verify Makefile target
        run: |
          set -euo pipefail
          make secrets-scan