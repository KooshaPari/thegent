# qgate quality gate for thegent.
#
# Runs the reusable qgate workflow from KooshaPari/phenotype-tooling on a
# Linux standard runner. Non-blocking until coverage reaches the
# .qgate.toml threshold (per the "1 via 2" protocol).
#
# Spectrum categories exercised (when PR #198 lands on phenotype-tooling):
#   - coverage: cargo-llvm-cov (Rust) + nyc (TS) merged via lcov
#   - a11y:     playwright tests with axe accessibility
#   - e2e:      playwright browser tests
#   - dast:     schemathesis against published OpenAPI spec
#   - sast:     semgrep config=auto (Rust + TS rulesets)
#   - sbom:     CycloneDX cargo + npm dependencies
#   - mutation: cargo-mutants (Rust, nightly)

name: qgate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qgate:
    continue-on-error: true   # remove once coverage ≥70%

    runs-on: ubuntu-latest   # Linux standard only — no billed runners

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Rust setup (for cargo-llvm-cov)
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef04a54b3a52498a5f41e40895c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview, rustfmt, clippy

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea00a3571f6e0 # v2.7.8
        with:
          workspaces: crates

      # Node setup (for TS coverage if applicable)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.0
        with:
          node-version: '24'
          cache: 'npm'

      # Install cargo-llvm-cov
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # Generate Rust coverage → lcov
      - name: Generate Rust coverage (lcov)
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-targets --lcov --output-path coverage/rust-lcov.info
          echo "Rust lcov size: $(wc -l < coverage/rust-lcov.info) lines"

      # Merge coverage reports if TS coverage exists
      - name: Merge coverage reports
        run: |
          # If multiple lcov files exist, merge them; otherwise use Rust coverage
          if [ -f coverage/ts-lcov.info ]; then
            npx lcov-result-merger coverage/rust-lcov.info coverage/ts-lcov.info -o coverage/lcov.info
          else
            cp coverage/rust-lcov.info coverage/lcov.info
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      # qgate reusable workflow — runs the gate, emits JSON report.
      - name: qgate quality gate
        uses: KooshaPari/phenotype-tooling/.github/workflows/reusable/quality-gate.yml@main
        with:
          coverage-report: coverage/lcov.info
          coverage-format: lcov
          threshold: 70
          not-applicable: ''
          sast-config: 'auto'
        secrets: inherit
