name: Security (SAST)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule: [{cron: "0 2 * * *"}]
permissions:
  contents: read
  security-events: write

jobs:
  # Tier 1: Fast/Essential
  codeql:
    runs-on: ubuntu-24.04
    continue-on-error: true  # Allow PRs to proceed even if CodeQL fails
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # was: @e46ed2cbd01164d986452f91f178727624ae40d7
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@68bde559dea0fdcac2102bfdf6230c5f70eb485e
      - uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: "/language:${{matrix.language}}"
    strategy:
      matrix:
        language: [typescript, python, rust, go]

  # Tier 3: Expensive/Comprehensive (may have rate limits)
  semgrep:
    runs-on: ubuntu-24.04
    continue-on-error: true  # Allow PRs to proceed even if Semgrep fails
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          generateSarif: true
          sarifFile: semgrep-results.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
