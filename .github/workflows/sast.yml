name: Security (SAST)
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule: [{cron: "0 2 * * *"}]
permissions:
  contents: read
  security-events: write

jobs:
  # Tier 1: Fast/Essential
  codeql:
    runs-on: ubuntu-latest
    continue-on-error: true  # Allow PRs to proceed even if CodeQL fails
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7  # was: @e46ed2cbd01164d986452f91f178727624ae40d7
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7
      - uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7
        with:
          category: "/language:${{matrix.language}}"
    strategy:
      matrix:
        language: [typescript, python, rust, go]

  # Tier 3: Expensive/Comprehensive (may have rate limits)
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true  # Allow PRs to proceed even if Semgrep fails
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          generateSarif: true
          sarifFile: semgrep-results.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
