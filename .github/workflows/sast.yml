name: Security (SAST)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule: [{cron: "0 2 * * *"}]
permissions:
  contents: read
  security-events: write

jobs:
  # Tier 1: Fast/Essential
  codeql:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    continue-on-error: true  # Allow PRs to proceed even if CodeQL fails
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # was: @e46ed2cbd01164d986452f91f178727624ae40d7
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          category: "/language:${{matrix.language}}"
    strategy:
      matrix:
        language: [typescript, python, rust, go]

  # Tier 3: Expensive/Comprehensive (may have rate limits)
  semgrep:
    runs-on: ubuntu-24.04
    continue-on-error: true  # Allow PRs to proceed even if Semgrep fails
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            .semgrep-rules/
          generateSarif: true
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
