permissions:
  contents: read

name: ZAP DAST
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    paths:
      - 'docs/**'
      - 'src/**'

jobs:
  zap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install ZAP
        run: |
          curl -fsSL -o zap-linux.tar.gz https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
          tar -xzf zap-linux.tar.gz
          mv ZAP_2.17.0 zap
      - name: Run ZAP
        run: |
          if ! curl -fsS http://localhost:8080 >/dev/null; then
            echo "No target service is listening on http://localhost:8080; skipping ZAP scan."
            exit 0
          fi
          zap/zap.sh -cmd -quickurl http://localhost:8080 -quickout zap-report.html
