permissions:
  contents: read

name: ZAP DAST
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    paths:
      - 'docs/**'
      - 'src/**'

jobs:
  zap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install ZAP
        run: |
          curl -fsSL -o zap-linux.tar.gz https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
          tar -xzf zap-linux.tar.gz
          mv ZAP_2.17.0 zap
      - name: Run ZAP
        run: |
          zap/wrapper.sh \
            -t http://localhost:8080 \
            -g https://github.com/kooshapari/phenotype-infrakit
