permissions:
  contents: read

name: ZAP DAST
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    paths:
      - '.github/workflows/zap-dast.yml'
      - 'docs/**'
      - 'src/**'

jobs:
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install ZAP
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
          tar -xzf ZAP_2.17.0_Linux.tar.gz
          mv ZAP_2.17.0 zap
      - name: Start local scan target
        run: |
          mkdir -p /tmp/zap-target
          printf '<!doctype html><title>thegent zap target</title><main>ok</main>\n' > /tmp/zap-target/index.html
          python3 -m http.server 8090 --directory /tmp/zap-target &
          sleep 2
      - name: Run ZAP
        run: |
          zap/zap.sh \
            -cmd \
            -quickurl http://localhost:8090 \
            -quickout zap-report.html
