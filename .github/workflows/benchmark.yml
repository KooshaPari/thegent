name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  benchmark:
    name: Comprehensive Benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Build extensions
        run: bash scripts/build-all-rust-extensions.sh

      - name: Run benchmarks
        run: |
          mkdir -p benchmarks/results
          bash scripts/benchmark-comprehensive.sh

      - name: Check for regressions
        run: |
          python3 << 'EOF'
          import json
          import sys

          try:
              with open('benchmarks/results/current/tool_detection_rust.json') as f:
                  current = json.load(f)
              with open('benchmarks/results/baseline/tool_detection_bash.json') as f:
                  baseline = json.load(f)

              current_mean = current['results'][0]['mean']
              baseline_mean = baseline['results'][0]['mean']

              if current_mean > baseline_mean * 1.1:
                  print(f"⚠️ Performance regression: {current_mean/baseline_mean:.2f}x slower")
                  sys.exit(1)
              else:
                  print(f"✅ Performance OK: {baseline_mean/current_mean:.2f}x faster")
          except FileNotFoundError:
              print("⚠️ Benchmark files not found, skipping regression check")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/

  benchmark-routing:
    name: Routing Pytest Benchmark (no xdist)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: bash ./scripts/ci_uv_sync.sh
        shell: bash

      - name: Build Rust extensions
        run: bash scripts/build-all-rust-extensions.sh

      - name: Run routing benchmark
        run: task bench:pytest:routing

      - name: Upload routing benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-routing
          path: benchmarks/results/

  benchmark-routing-xdist:
    name: Routing Pytest Benchmark (xdist)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: bash ./scripts/ci_uv_sync.sh
        shell: bash

      - name: Build Rust extensions
        run: bash scripts/build-all-rust-extensions.sh

      - name: Run routing benchmark with xdist
        run: task bench:pytest:routing-xdist

      - name: Upload routing xdist benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-routing-xdist
          path: benchmarks/results/

  benchmark-e2e-heavy:
    name: Heavy E2E Pytest Benchmark (no xdist)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: bash ./scripts/ci_uv_sync.sh
        shell: bash

      - name: Build Rust extensions
        run: bash scripts/build-all-rust-extensions.sh

      - name: Run heavy e2e benchmark
        run: task bench:pytest:e2e-heavy

      - name: Upload heavy e2e benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-e2e-heavy
          path: benchmarks/results/

  benchmark-e2e-heavy-xdist:
    name: Heavy E2E Pytest Benchmark (xdist)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: bash ./scripts/ci_uv_sync.sh
        shell: bash

      - name: Build Rust extensions
        run: bash scripts/build-all-rust-extensions.sh

      - name: Run heavy e2e benchmark with xdist
        run: task bench:pytest:e2e-heavy-xdist

      - name: Upload heavy e2e xdist benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-e2e-heavy-xdist
          path: benchmarks/results/
