name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-libs:
    name: Build Rust libs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: libs/cipher
            artifact: cipher-crate
          - crate: libs/tracing
            artifact: tracing-crate
          - crate: libs/logger
            artifact: logger-crate
          - crate: libs/metrics
            artifact: metrics-crate
          - crate: libs/nexus
            artifact: nexus-crate
          - crate: libs/gauge
            artifact: gauge-crate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: |
          cd "${{ matrix.crate }}"
          cargo build --release
          cargo package --allow-dirty --no-verify
          mkdir -p "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}"
          cp target/package/*.crate "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

  rust-cli:
    name: Build Rust CLI tools
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: tools/forge
            binary: forge
            artifact: forge-binary
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: |
          cd "${{ matrix.crate }}"
          cargo build --release
          mkdir -p "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}"
          cp "target/release/${{ matrix.binary }}" "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

  python-libs:
    name: Build Python packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: tools/dep-guard
            artifact: dep-guard-wheel
          - pkg: libs/evaluation
            artifact: evaluation-wheel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: |
          cd ${{ matrix.pkg }}
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pkg }}/dist/*
