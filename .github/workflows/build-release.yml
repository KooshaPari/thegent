name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-libs:
    name: Build Rust libs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - libs/cipher
          - libs/tracing
          - libs/logger
          - libs/metrics
          - libs/nexus
          - libs/gauge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release --manifest-path=${{ matrix.crate }}/Cargo.toml
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.crate }}
          cp -r ${{ matrix.crate }}/target/release/${{ matrix.crate }} dist/${{ matrix.crate }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-artifact
          path: dist/${{ matrix.crate }}/

  rust-cli:
    name: Build Rust CLI tools
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - tools/forge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release --manifest-path=${{ matrix.crate }}/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-binary
          path: ${{ matrix.crate }}/target/release/${{ matrix.crate }}

  python-libs:
    name: Build Python packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - tools/dep-guard
          - libs/evaluation
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        run: |
          cd ${{ matrix.pkg }}
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-pywheel
          path: ${{ matrix.pkg }}/dist/*.whl
