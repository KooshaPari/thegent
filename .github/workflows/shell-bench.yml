name: Shell Performance Benchmark

on:
  push:
    branches: [main, develop]
    paths:
      - 'shell/**'
      - '.github/workflows/shell-bench.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'shell/**'
      - '.github/workflows/shell-bench.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  zsh-bench:
    name: zsh Shell Performance (zsh-bench)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install zsh
        run: |
          if ! command -v zsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y zsh
          fi
          zsh --version

      - name: Install zsh-bench
        run: |
          git clone --depth=1 https://github.com/romkatv/zsh-bench /tmp/zsh-bench
          chmod +x /tmp/zsh-bench/zsh-bench

      - name: Run shell startup benchmark
        id: bench
        run: |
          mkdir -p benchmarks/results/shell
          /tmp/zsh-bench/zsh-bench --iters 5 2>/dev/null | tee benchmarks/results/shell/latest.txt
          python3 << 'EOF'
          import re
          import json

          with open('benchmarks/results/shell/latest.txt') as f:
              raw = f.read()

          metrics = {}
          for line in raw.splitlines():
              m = re.match(r'^\s*(\w+)\s*=\s*([0-9.]+)', line)
              if m:
                  metrics[m.group(1)] = float(m.group(2))

          print("Parsed metrics:", json.dumps(metrics, indent=2))

          with open('benchmarks/results/shell/metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)

          thresholds = {
              'first_prompt_lag': 50.0,
              'command_lag': 10.0,
              'input_lag': 5.0,
          }

          violations = []
          for metric, limit in thresholds.items():
              value = metrics.get(metric)
              if value is not None and value > limit:
                  violations.append(f"{metric}={value:.1f}ms exceeds threshold {limit}ms")

          if violations:
              print("\nPERFORMANCE THRESHOLD VIOLATIONS:")
              for v in violations:
                  print(f"  FAIL: {v}")
              raise SystemExit(1)
          else:
              print("\nAll shell performance metrics within thresholds.")
          EOF

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zsh-bench-results-${{ github.run_id }}
          path: benchmarks/results/shell/
          retention-days: 90
