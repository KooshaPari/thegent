name: Codebase Atlas

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository path'
        required: false
        default: '.'

jobs:
  generate-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: |
          chmod +x scripts/generate_codebase_atlas.sh
          chmod +x scripts/install_hooks.sh

      - name: Get repo name
        id: repo-name
        run: |
          echo "name=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT

      - name: Generate Atlas
        id: generate
        run: |
          ./scripts/generate_codebase_atlas.sh --quiet --output-dir .atlas
          echo "generated=true" >> $GITHUB_OUTPUT

      - name: Upload Atlas Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codebase-atlas-${{ steps.repo-name.outputs.name }}
          path: |
            .atlas/
            !.atlas/stats_temp.json
          retention-days: 30

      - name: Generate Summary
        if: success()
        run: |
          if [ -f .atlas/README.md ]; then
            echo "## Codebase Atlas Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -30 .atlas/README.md >> $GITHUB_STEP_SUMMARY
          fi

  atlas-report:
    runs-on: ubuntu-latest
    needs: generate-atlas
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: codebase-atlas-${{ github.event.repository.name }}
          path: .atlas
          continue-on-error: true

      - name: PR Comment
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .atlas/stats.json ]; then
            TOTAL_LOC=$(cat .atlas/stats.json | jq -r '.total_loc // "N/A"')
            TOTAL_FILES=$(cat .atlas/stats.json | jq -r '.total_files // "N/A"')
            LANGUAGES=$(cat .atlas/stats.json | jq -r '.total_languages // "N/A"')
            echo "## Codebase Atlas Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total LOC | $TOTAL_LOC |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Files | $TOTAL_FILES |" >> $GITHUB_STEP_SUMMARY
            echo "| Languages | $LANGUAGES |" >> $GITHUB_STEP_SUMMARY
          fi

  update-docs:
    runs-on: ubuntu-latest
    needs: generate-atlas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: codebase-atlas-${{ github.event.repository.name }}
          path: .atlas
          continue-on-error: true

      - name: Update Docs
        if: success() && !needs.generate-atlas.outputs.generated == ''
        run: |
          mkdir -p docs/atlas
          cp .atlas/README.md docs/atlas/
          cp .atlas/*.md docs/atlas/ 2>/dev/null || true

      - name: Configure Git
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit and Push
        if: success()
        run: |
          git add docs/atlas/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update codebase atlas [skip ci]"
            git push
          fi
