name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          cache: 'pip'
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bash ./scripts/ci_uv_sync.sh
          bun install --frozen-lockfile
        shell: bash

      - name: Generate docs/API references
        run: |
          python3 scripts/vitepress-agent-workflow.py --skip-demos
          bun run docs:build

      - name: Build Python artifacts
        run: uv build

      - name: Python vulnerability audit (JSON)
        run: uv run pip-audit --format=json --output dist/pip-audit.json

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Rust vulnerability audit (JSON)
        run: cargo audit --json > dist/cargo-audit.json

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX JSON)
        run: syft dir:. -o spdx-json=dist/sbom.spdx.json

      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Emit governance release control-plane artifacts
        run: |
          mkdir -p artifacts/quality
          uv run python scripts/quality_control_plane_report.py \
            --contract contracts/quality-control-plane-v1.json \
            --json-out artifacts/quality/control-plane-readiness.json \
            --md-out artifacts/quality/control-plane-readiness.md
          uv run python scripts/attest_governance_contract_report.py \
            --report-json artifacts/quality/control-plane-readiness.json \
            --attestation-out dist/governance-control-plane-attestation.json

      - name: Verify governance release attestation
        run: |
          uv run python scripts/verify_governance_contract_attestation.py \
            --report-json artifacts/quality/control-plane-readiness.json \
            --attestation-json dist/governance-control-plane-attestation.json

      - name: Verify SBOM artifact was generated
        run: |
          test -s dist/sbom.spdx.json

      - name: Stage release governance artifacts
        run: |
          cp artifacts/quality/control-plane-readiness.json dist/
          cp artifacts/quality/control-plane-readiness.md dist/

      - name: Package docs artifact
        run: tar -czf dist/docs-dist.tar.gz docs-dist

      - name: Set artifact metadata
        id: meta
        run: echo "artifact_name=release-artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  github-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-artifacts.outputs.artifact_name }}
          path: dist

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
