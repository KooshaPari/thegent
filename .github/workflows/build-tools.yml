name: Build Tools

on:
  push:
    branches:
      - main
      - 'phase7/**'
      - 'phase6/**'
      - 'release/**'
    paths:
      - 'tools/**'
      - '.github/workflows/build-tools.yml'
      - 'tools/scripts/build-tools.sh'

concurrency:
  group: build-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build tool projects
        run: bash tools/scripts/build-tools.sh
