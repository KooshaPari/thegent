name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly
  workflow_dispatch:

jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mutation testing tools
        run: |
          pip install mutmut pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run mutation tests
        run: |
          mutmut run --python-path=python --source=src \
            --tests=tests/unit

      - name: Show results
        run: mutmut show

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .mutmut/
