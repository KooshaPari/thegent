permissions:
  contents: read

name: Security Scan
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  SKIP_QUOTA_INTENSIVE: ${{ github.event_name == 'pull_request' && github.event.pull_request.additions <= 50 }}

jobs:
  # Secret Scanning (always runs - lightweight)
  secrets:
    name: Secret Detection
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --verbose --redact

  # License Compliance (using reuse-action - lightweight)
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Skip on PRs to save quota - run only on schedule
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Analyze licenses
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5
        continue-on-error: true  # Allow findings but don't fail

      - name: Check for non-reusable licenses
        run: |
          # Check for problematic licenses
          grep -r "GPL\|AGPL" --include="*.toml" --include="*.json" . || true

  # SAST Scanning (Layered - Semgrep primary, CodeQL backup)
  sast:
    name: SAST Analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    # Skip if no code changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Run ESLint Security
        run: npx eslint . --ext .ts,.tsx --config .eslintrc.security.js || true
        continue-on-error: true

      - name: Run Semgrep (Primary)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: |
            p/typescript
            p/security-audit
            p/secrets
          generateSarif: "1"
          sarifFile: "semgrep-results.sarif"
        continue-on-error: true  # Allow quota limits

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # CodeQL backup (only on schedule, not PRs - quota optimization)
      - name: Initialize CodeQL (Backup - schedule only)
        if: github.event_name == 'schedule'
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: typescript

      - name: Run CodeQL (Backup - schedule only)
        if: github.event_name == 'schedule'
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: "/language:typescript"

  # Dependency Vulnerability Scanning
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'  # Skip on PRs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd


      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

  # Container Scanning (if Dockerfile exists)
  container:
    name: Container Scan
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Detect Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.dockerfile.outputs.exists == 'true'
        run: docker build -t ${{ github.event.repository.name }}:scan .

      - name: Run Trivy vulnerability scanner
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98
        with:
          image-ref: '${{ github.event.repository.name }}:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
