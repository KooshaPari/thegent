name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  preflight:
    name: CI Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv toolchain
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Task runner
        uses: arduino/setup-task@v2

      - name: Install project dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run CI preflight
        run: |
          task ci:preflight

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Build PR changed file list
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts/pytest/requirements
          git fetch origin "${GITHUB_BASE_REF}" --depth=1
          git diff --name-only "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}" > artifacts/pytest/requirements/changed-files.txt
        shell: bash

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_PR_CHANGED_FILE_LIST: artifacts/pytest/requirements/changed-files.txt
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            task test:pr-gate
          else
            task test:collect:fast-gate
            task test:fast-lane
          fi

      - name: Print pytest health alerts
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          artifact = pathlib.Path("artifacts/pytest/health/pr-gate.json")
          if not artifact.exists():
              print("No pytest health artifact found for this job.")
              sys.exit(0)

          payload = json.loads(artifact.read_text(encoding="utf-8"))
          alerts = payload.get("alerts", [])
          status = payload.get("overall_status", "unknown")
          score = payload.get("overall_health_score", "N/A")
          print(f"Pytest health status: {status} (score: {score})")
          for alert in alerts:
              prefix = alert.get("severity", "info").upper()
              code = alert.get("code", "unknown")
              title = alert.get("title", "No title")
              details = alert.get("details", "")
              action = alert.get("recommended_action", "")
              print(f"{prefix} {code}: {title}")
              print(f"  {details}")
              print(f"  Action: {action}")
          if status == "failed":
              raise SystemExit(1)
          PY

      - name: Run leak detection tests
        run: |
          uv run pytest tests/test_resource_leaks.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            htmlcov/
            artifacts/pytest/
          retention-days: 7

      - name: Upload pytest health dashboard
        if: always() && hashFiles('artifacts/pytest/health/pr-gate.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-health-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            artifacts/pytest/health/pr-gate.json
            artifacts/pytest/health/pr-gate.md
          retention-days: 14

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: [preflight]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv toolchain
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Task runner
        uses: arduino/setup-task@v2

      - name: Install project dependencies
        run: |
          uv sync --all-extras --dev

      - name: Sanity check Python runtime
        run: |
          uv run python -V

      - name: Assert canonical max-lines CI path (WL-122)
        run: |
          uv run python scripts/check_wl122_max_lines_canonical_path.py --strict

      - name: Check extension package metadata sanity (WL-117)
        run: |
          uv run python scripts/check_extension_package_metadata.py --strict

      - name: Run max-lines gate via canonical task path (WL-122)
        run: |
          task quality:max-lines

      - name: Run mandatory quality gates (fail-closed)
        shell: bash
        run: |
          # Fail closed.
          set +e
          task quality:sitback-contracts
          sitback_rc=$?
          task quality:harness-model-contracts
          harness_rc=$?
          task quality:providers:required-gate
          provider_rc=$?
          task quality:runtime-contracts
          runtime_rc=$?
          task quality:security:sast
          security_rc=$?
          task quality:chaos:smoke
          chaos_rc=$?
          task quality:a11y:smoke
          a11y_rc=$?
          set -e
          if [ "$sitback_rc" -ne 0 ] || [ "$harness_rc" -ne 0 ] || [ "$provider_rc" -ne 0 ] || [ "$runtime_rc" -ne 0 ] || [ "$security_rc" -ne 0 ] || [ "$chaos_rc" -ne 0 ] || [ "$a11y_rc" -ne 0 ]; then
            exit 1
          fi

      - name: Deterministic benchmark smoke
        run: |
          task bench:smoke:ci

      - name: Performance gate alias
        run: |
          task quality:perf:benchmark-gate

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [test, quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run coverage CI gate
        run: |
          task coverage:ci

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            .coverage*
            coverage.xml
            htmlcov/
          retention-days: 7

  template-collect-nightly:
    name: Template Path Collect (Nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run template-tree collect-only
        run: |
          task test:collect:templates

      - name: Upload template collect artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-collect-nightly
          path: artifacts/pytest/baseline/template-collect.json
          retention-days: 14

  leak-detection:
    name: Leak Detection (Comprehensive)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Verify psutil installation
        run: |
          uv run python -c "import psutil; print(f'psutil version: {psutil.__version__}')"

      - name: Verify psleak installation
        run: |
          uv run python -c "import psleak; print('psleak available')" || echo "psleak check completed"

      - name: Run psleak-based leak detection tests
        run: |
          uv run pytest tests/test_resource_leaks.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"

      - name: Run tracemalloc-based memory leak tests
        run: |
          uv run pytest tests/test_resource_leaks.py::TestMemoryLeaksTracemalloc -v --tb=short || echo "tracemalloc tests completed"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"

      - name: Run CPython-style reference leak tests
        run: |
          uv run pytest tests/test_resource_leaks.py::TestReferenceLeaks -v --tb=short || echo "reference leak tests completed"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"

      - name: Upload leak detection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-detection-results
          path: |
            .pytest_cache/
          retention-days: 30

  # WL-132 B90-W2-D4: Zig ABI readiness gate (non-blocking until P0 promotion)
  # Verifies thegent-zmx-interop (Rust<->Zig interop crate) builds and tests pass.
  # continue-on-error: true because Zig is P2/experimental; CI must not block on it.
  zig-readiness:
    name: Zig ABI Readiness Gate (WL-132)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-zmx-${{ hashFiles('crates/thegent-zmx-interop/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zmx-

      - name: Build thegent-zmx-interop (default features, no zmx-native)
        run: cargo build -p thegent-zmx-interop
        working-directory: crates

      - name: Run thegent-zmx-interop tests (subprocess fallback lane)
        run: cargo test -p thegent-zmx-interop
        working-directory: crates

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [coverage]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run integration tests
        run: |
          uv run pytest tests/ -v -m "integration" || echo "No integration tests found"
        env:
          PYTHONPATH: ${{ github.workspace }}
