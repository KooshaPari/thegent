name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      
      - name: Run tests
        run: |
          uv run pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Run leak detection tests
        run: |
          uv run pytest tests/test_resource_leaks.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      
      - name: Run linting
        run: |
          uv run ruff check src/ tests/
      
      - name: Check formatting
        run: |
          uv run ruff format --check src/ tests/
      
      - name: Run type checking
        run: |
          uv run ty check src/
      
      - name: Run security checks
        run: |
          uv run ruff check --select S src/
          uv run pip-audit || echo "pip-audit not available, skipping"
      
      - name: Check for dead code
        run: |
          uv run vulture src/ --min-confidence 80 || echo "vulture check completed"
      
      - name: Check complexity
        run: |
          uv run radon cc src/ --min C --show-complexity || echo "radon check completed"
          uv run radon mi src/ --min B || echo "radon maintainability check completed"

  leak-detection:
    name: Leak Detection (Comprehensive)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      
      - name: Verify psutil installation
        run: |
          uv run python -c "import psutil; print(f'psutil version: {psutil.__version__}')"
      
      - name: Verify psleak installation
        run: |
          uv run python -c "import psleak; print('psleak available')" || echo "psleak check completed"
      
      - name: Run psleak-based leak detection tests
        run: |
          uv run pytest tests/test_resource_leaks.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"
      
      - name: Run tracemalloc-based memory leak tests
        run: |
          uv run pytest tests/test_resource_leaks.py::TestMemoryLeaksTracemalloc -v --tb=short || echo "tracemalloc tests completed"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"
      
      - name: Run CPython-style reference leak tests
        run: |
          uv run pytest tests/test_resource_leaks.py::TestReferenceLeaks -v --tb=short || echo "reference leak tests completed"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHECK_LEAKS: "1"
      
      - name: Upload leak detection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-detection-results
          path: |
            .pytest_cache/
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      
      - name: Run integration tests
        run: |
          uv run pytest tests/ -v -m "integration" || echo "No integration tests found"
        env:
          PYTHONPATH: ${{ github.workspace }}
