name: Testing Infrastructure

on:
  push:
    branches: [main, refactor/**]
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - '**.py'
  pull_request:
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
  schedule:
    - cron: '0 4 * * *'  # Weekly conversation testing

jobs:
  vitest-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install vitest @vitest/coverage-v8

      - name: Run Vitest
        run: npx vitest run --reporter=json

  pytest-tests:
    name: Pytest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-json-report

      - name: Run pytest
        run: pytest tests/ -v --json-report --json-report-file=report.json

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install @playwright/test && npx playwright install --with-deps

      - name: Run Playwright
        run: npx playwright test

  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Coverage
        run: |
          pip install pytest-cov
          pytest --cov=. --cov-report=xml --cov-report=html
