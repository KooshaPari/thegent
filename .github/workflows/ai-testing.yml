permissions:
  contents: read

name: Testing Infrastructure
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main, refactor/**]
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - '**.py'
  pull_request:
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
  schedule:
    - cron: '0 4 * * *'  # Weekly conversation testing

jobs:
  vitest-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install & Run Vitest
        run: |
          bun add -d vitest @vitest/coverage-v8
          bun run vitest run --reporter=json --passWithNoTests

  pytest-tests:
    name: Pytest Tests (uv)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install & Run pytest
        run: |
          uv run --with pytest --with pytest-cov --with pytest-json-report \
            pytest tests/ -v --json-report --json-report-file=report.json

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install & Run Playwright
        run: |
          bun add -d @playwright/test
          bunx playwright install --with-deps
          bun run playwright test --pass-with-no-tests

  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Generate Coverage
        run: |
          uv run --with pytest-cov pytest --cov=. --cov-report=xml --cov-report=html
