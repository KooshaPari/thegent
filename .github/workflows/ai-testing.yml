name: Testing Infrastructure

on:
  push:
    branches: [main, refactor/**]
    paths:
      - 'tests/**'
      - '.test-config.yaml'
      - 'tests/kaneai/**'
      - 'tests/visual/**'
      - '**.py'
  pull_request:
    paths:
      - 'tests/**'
      - '.test-config.yaml'
  schedule:
    - cron: '0 4 * * *'  # Weekly conversation testing

jobs:
  conversation-tests:
    name: Conversation Scenario Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Conversation Tests
        run: |
          echo "Conversation scenarios:"
          echo "  - Scenarios: $(grep -c 'name:' tests/kaneai/conversations.yaml)"
          echo "  - Multi-turn: $(grep -c 'turns:' tests/kaneai/conversations.yaml)"

  visual-tui:
    name: Visual TUI Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run TUI Tests
        run: |
          echo "Visual TUI tests:"
          echo "Tests: $(grep -c 'def test_' tests/visual/tui_testing.py)"
          pytest tests/visual/tui_testing.py -v || echo "TUI tests pending CLI integration"

  agent-behavior:
    name: Agent Behavior Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test_file:
          - test_agent_hierarchy.py
          - test_agent_registry_full.py
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ${{ matrix.test_file }}
        run: pytest tests/${{ matrix.test_file }} -v --tb=short

  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Coverage
        run: |
          echo "Generating coverage report"
          pip install pytest-cov
          pytest --cov=. --cov-report=xml --cov-report=html || true
