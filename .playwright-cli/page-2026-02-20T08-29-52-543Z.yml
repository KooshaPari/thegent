              - paragraph [ref=e178]: Persistent auto-memory that carries context across conversations
            - generic [ref=e179]:
              - generic [ref=e180]: Ante has a persistent memory system that lets the agent build up knowledge across conversations. Insights, patterns, and lessons learned are stored in memory files and automatically loaded into the system prompt for future sessions.
              - heading "Navigate to header How it works" [level=2] [ref=e181]:
                - link "Navigate to header" [ref=e182] [cursor=pointer]:
                  - /url: "#how-it-works"
                  - img [ref=e184]
                - generic [ref=e186] [cursor=pointer]: How it works
              - generic [ref=e187]:
                - text: Each project has a memory directory (typically
                - code [ref=e188]: .claude/projects/<project-path>/memory/
                - text: ). The key file is
                - code [ref=e189]: MEMORY.md
                - text: — its contents are injected into the system prompt at the start of every conversation.
              - heading "Navigate to header Automatic behavior" [level=3] [ref=e190]:
                - link "Navigate to header" [ref=e191] [cursor=pointer]:
                  - /url: "#automatic-behavior"
                  - img [ref=e193]
                - generic [ref=e195] [cursor=pointer]: Automatic behavior
              - generic [ref=e196]: "As the agent works on your project, it:"
              - list [ref=e197]:
                - listitem [ref=e198]:
                  - strong [ref=e199]: Consults
                  - text: existing memory files to build on previous experience
                - listitem [ref=e200]:
                  - strong [ref=e201]: Records
                  - text: new insights when it encounters common mistakes or useful patterns
                - listitem [ref=e202]:
                  - strong [ref=e203]: Updates
                  - text: or removes memories that turn out to be wrong or outdated
