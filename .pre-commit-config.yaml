repos:
  - repo: local
    hooks:
      - id: pheno-vibecoding-guard
        name: pheno-vibecoding-guard
        # NOTE: the upstream `pheno-vibecoding-guard scan` CLI subcommand is
        # not yet released (cli.py imports a non-existent `check` symbol from
        # guard.py as of v0.1.0). Until upstream is fixed, we invoke the
        # Python API directly. Equivalent to a `scan .` on staged files.
        entry: >-
          python -c "import sys;
          from pheno_vibecoding_guard import scan_repo;
          r = scan_repo('.');
          sys.exit(0 if r.clean else 1)"
        language: system
        stages: [pre-commit]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
