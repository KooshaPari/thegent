# thegent -- Pre-commit hooks (Gates 1-3: syntax, lint, type)
# Stack: Python (pyproject.toml, src layout, uv, structlog, tenacity)

repos:
  # --- Base hooks (syntax validation - Gate 1) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: check-json
        exclude: |
          (?x)^(
            test_output\.json|
            node_modules/.+|
            \.venv/.+|
            benchmarks/results/.+|
            test-results/.+|
            scripts/.+\.json$|
            docs/research/dumps/.*\.json$
          )$
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: check-ast

  # --- Python lint + format (Gate 2) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.10.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks

  # --- Local hooks (Gate 2-3) ---
  - repo: local
    hooks:
      - id: dx-audit
        name: DX Standards Audit
        entry: bash scripts/dx-audit.sh
        language: system
        pass_filenames: false

      - id: max-lines-gate
        name: Canonical Max-Lines Gate
        entry: task quality:max-lines
        language: system
        pass_filenames: false

      - id: tach
        name: Architectural Boundary Check
        entry: tach check
        language: system
        pass_filenames: false

      - id: ty
        name: Fast Type Check (ty) (Gate 3)
        entry: uv run ty check src/
        language: system
        pass_filenames: false
        types: [python]

      - id: basedpyright
        name: Strict Type Check (basedpyright) (Gate 3)
        entry: uv run basedpyright src/
        language: system
        pass_filenames: false
        types: [python]

      - id: shellcheck
        name: Shellcheck (project scripts)
        entry: shellcheck
        language: system
        args: ["--shell", "bash"]
        files: "^hooks/.+\\.sh$|^scripts/.+\\.sh$|^tests/.+\\.sh$|^.github/workflows/.+\\.yml$"
        types: [shell]

      - id: docs-build
        name: Build VitePress Docsite
        entry: hooks/pre-commit-docs.sh
        language: script
        pass_filenames: false
        files: '^docs/'
