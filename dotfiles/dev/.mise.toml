# dotfiles/dev/.mise.toml
# Canonical tool version configuration for Phenotype development
# Install: ln -sf "$DOTFILES_DIR/dev/.mise.toml" ~/.config/mise/config.toml
# https://mise.jdx.dev

[tools]
# Language runtimes
python = "3.12"
node = "22"
go = "1.23"
rust = "stable"

# Build/task tools
go-task = "latest"   # 'task' command for Taskfile.yml

# Quality tools
ruff = "latest"
golangci-lint = "latest"

# Utility tools
uv = "latest"
bun = "latest"

[settings]
# Auto-install tools when entering a directory with a .tool-versions or .mise.toml
auto_install = true

[env]
# Phenotype workspace root
PHENOTYPE_REPOS = "/Users/kooshapari/CodeProjects/Phenotype/repos"
DOTFILES_DIR = "{{env.HOME}}/.dotfiles"
