# dotfiles/dev/Taskfile.global.yml
# Global taskfile with common cross-project tasks
# Include in project Taskfile.yml with:
#   includes:
#     global: ~/.dotfiles/dev/Taskfile.global.yml
# https://taskfile.dev

version: '3'

tasks:
  # --- Phenotype Worktree Workflow ---
  wt:new:
    desc: "Create a new worktree: task wt:new -- <project> <topic>"
    cmds:
      - |
        PROJECT="{{.CLI_ARGS | splitList " " | first}}"
        TOPIC="{{.CLI_ARGS | splitList " " | last}}"
        WDIR="/Users/kooshapari/CodeProjects/Phenotype/repos/worktrees/$PROJECT/$TOPIC"
        git -C "/Users/kooshapari/CodeProjects/Phenotype/repos/$PROJECT" worktree add "$WDIR" -b "feat/$TOPIC"
        echo "Created worktree at $WDIR"

  wt:list:
    desc: "List all active worktrees across Phenotype repos"
    cmds:
      - |
        for repo in /Users/kooshapari/CodeProjects/Phenotype/repos/*/; do
          if [[ -d "$repo/.git" ]] || [[ -f "$repo/.git" ]]; then
            echo "=== $(basename $repo) ==="
            git -C "$repo" worktree list 2>/dev/null || true
          fi
        done

  wt:clean:
    desc: "Remove stale worktrees (prune locked/missing)"
    cmds:
      - |
        for repo in /Users/kooshapari/CodeProjects/Phenotype/repos/*/; do
          if [[ -d "$repo/.git" ]] || [[ -f "$repo/.git" ]]; then
            git -C "$repo" worktree prune 2>/dev/null || true
          fi
        done
        echo "Pruned stale worktrees"

  # --- Claude Hooks ---
  hooks:install:
    desc: "Install/update Claude hooks from dotfiles"
    cmds:
      - |
        HOOKS_SRC="/Users/kooshapari/CodeProjects/Phenotype/repos/thegent/hooks"
        HOOKS_DST="$HOME/.claude/hooks"
        if [[ -d "$HOOKS_SRC" ]]; then
          mkdir -p "$HOOKS_DST"
          cp -r "$HOOKS_SRC/"* "$HOOKS_DST/"
          chmod +x "$HOOKS_DST"/*.sh 2>/dev/null || true
          echo "Hooks installed to $HOOKS_DST"
        else
          echo "No hooks source found at $HOOKS_SRC"
        fi

  hooks:list:
    desc: "List installed Claude hooks"
    cmds:
      - ls -la ~/.claude/hooks/ 2>/dev/null || echo "No hooks installed"

  # --- Quality (cross-project) ---
  fmt:
    desc: "Format all code in current directory (auto-detects language)"
    cmds:
      - |
        if [[ -f "pyproject.toml" ]]; then uv run ruff format . 2>/dev/null || true; fi
        if [[ -f "package.json" ]]; then pnpm exec prettier --write . 2>/dev/null || true; fi
        if [[ -f "go.mod" ]]; then gofumpt -w . 2>/dev/null || go fmt ./... 2>/dev/null || true; fi
        if [[ -f "Cargo.toml" ]]; then cargo fmt 2>/dev/null || true; fi

  lint:
    desc: "Lint all code in current directory (auto-detects language)"
    cmds:
      - |
        if [[ -f "pyproject.toml" ]]; then uv run ruff check . 2>/dev/null || true; fi
        if [[ -f "package.json" ]]; then pnpm exec oxlint . 2>/dev/null || true; fi
        if [[ -f "go.mod" ]]; then golangci-lint run ./... 2>/dev/null || true; fi
        if [[ -f "Cargo.toml" ]]; then cargo clippy 2>/dev/null || true; fi

  # --- Dotfiles ---
  dotfiles:sync:
    desc: "Symlink all dotfiles to their canonical locations"
    cmds:
      - "{{.DOTFILES_DIR}}/setup.sh --sync"

  dotfiles:update:
    desc: "Pull latest dotfiles from thegent repo"
    cmds:
      - git -C /Users/kooshapari/CodeProjects/Phenotype/repos/thegent pull origin main
      - echo "thegent updated"
