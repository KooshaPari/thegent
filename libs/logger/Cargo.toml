[package]
name = "logger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Structured logging helpers: LoggerConfig, log_json! macro, LogContext"
repository = "https://github.com/phenotype-dev/logger"
readme = "README.md"
keywords = ["logging", "structured-logging", "json-logging"]
categories = ["development-tools", "logging"]

[dependencies]
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
