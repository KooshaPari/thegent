[package]
name = "hexagonal_rs"
version = "0.2.0"
edition = "2024"
description = "Hexagonal Architecture Library (Ports & Adapters) with Clean Architecture and DDD"
license = "MIT"
repository = "https://github.com/phenotype/libs/hexagonal-rs"
keywords = ["hexagonal", "architecture", "clean-architecture", "ddd", "ports-and-adapters"]
categories = ["architecture", "design-patterns"]

[dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockall = "0.13"

[features]
default = []
