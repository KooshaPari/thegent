[package]
name = "phenotype-tracing"
version = "0.1.0"
edition = "2021"
description = "Phenotype distributed tracing library following hexagonal architecture"
readme = "README.md"
license = "MIT"
authors = ["Phenotype"]
keywords = ["tracing", "distributed", "opentelemetry", "observability"]
categories = ["development-tools"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
opentelemetry = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["tonic"] }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-http = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = ["otlp", "stdout"]
otlp = ["opentelemetry-otlp"]
stdout = ["tracing-subscriber/env-filter"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
