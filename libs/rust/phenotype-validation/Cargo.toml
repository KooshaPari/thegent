[package]
name = "phenotype-validation"
version = "0.1.0"
edition = "2021"
description = "Phenotype validation library following hexagonal architecture"
readme = "README.md"
license = "MIT"
authors = ["Phenotype"]
keywords = ["validation", "schema", "rules", "hexagonal"]
categories = ["validation", "data-structures"]

[dependencies]
thiserror = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.4"
