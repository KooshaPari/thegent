[package]
name = "phenotype-storage"
version = "0.1.0"
edition = "2021"
description = "Phenotype storage abstractions following hexagonal architecture"
readme = "README.md"
license = "MIT"
authors = ["Phenotype"]
keywords = ["storage", "repository", "persistence", "hexagonal"]
categories = ["data-structures"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[features]
default = []
postgres = ["tokio-postgres"]
redis = ["redis"]
dynamodb = ["aws-sdk-dynamodb"]
s3 = ["aws-sdk-s3"]
