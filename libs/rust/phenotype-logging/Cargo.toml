[package]
name = "phenotype-logging"
version = "0.1.0"
edition = "2021"
description = "Phenotype structured logging library following hexagonal architecture"
readme = "README.md"
license = "MIT"
authors = ["Phenotype"]
keywords = ["logging", "structured", "tracing", "observability"]
categories = ["logging"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread"] }

[dev-dependencies]
tracing-test = "0.2"
pretty_assertions = "1.4"

[features]
default = ["env-filter", "json-output"]
env-filter = ["tracing-subscriber/env-filter"]
json-output = ["tracing-subscriber/json"]
