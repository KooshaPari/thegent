[workspace]
resolver = "2"
members = [
    # Phenotype Domain (core business logic)
    "phenotype-config",

    # Helix Productized Libraries (marketable to external users)
    "helix-errors",
    "helix-ports",

    # Phenotype Architectures
    "phenotype-hexagonal",
    "phenotype-clean-arch",
    "phenotype-plugin-core",
    "phenotype-xdd",

    # Legacy/internal
    "agileplus-p2p",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70.0"
license = "MIT"

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", features = ["rt", "sync", "macros"] }
async-trait = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Caching
dashmap = "6.0"
lru = "0.12"
moka = { version = "0.12", features = ["sync", "future"] }

# Serialization
toml = "0.8"

# Validation
regex = "1.10"
