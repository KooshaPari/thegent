[package]
name = "phenotype-hexagonal"
version = "0.1.0"
edition = "2021"
description = "Hexagonal Architecture primitives for Phenotype ecosystem"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phenotype/phenotype-hexagonal"
documentation = "https://docs.phenotype.dev/phenotype-hexagonal"
readme = "README.md"
keywords = ["hexagonal", "ports-and-adapters", "clean-architecture", "ddd", "cqrs"]
categories = ["architecture", "development-tools"]

[features]
default = ["std"]
std = []

[dependencies]
# Domain primitives - no external dependencies for core domain
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# For feature flags and configuration
once_cell = "1.19"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "macros"] }

[[example]]
name = "simple_todo"
path = "examples/simple_todo.rs"

[[example]]
name = "order_service"
path = "examples/order_service.rs"

[[example]]
name = "user_management"
path = "examples/user_management.rs"
