[package]
name = "helix-errors"
version = "0.1.0"
edition = "2021"
description = "Comprehensive error handling primitives with context, tracing, and multi-language support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phenotype-dev/helix-errors"
documentation = "https://docs.helix.dev/helix-errors"
readme = "README.md"
keywords = ["error-handling", "result-type", "context", "tracing", "no-std"]
categories = ["development-tools", "error-handling"]
rust-version = "1.70"

[features]
default = ["std", "trace", "serde"]
std = ["alloc"]
trace = ["tracing"]
serde = ["dep:serde", "dep:serde_json", "alloc"]
alloc = []

[dependencies]
# Core - no external dependencies for core domain
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Tracing support (optional)
tracing = { version = "0.1", optional = true }

# Async support (optional)
tokio = { version = "1.0", features = ["sync"], optional = true }

# Logging support
log = "0.4"

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "helix_errors"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "with_context"
path = "examples/with_context.rs"

[[example]]
name = "with_tracing"
path = "examples/with_tracing.rs"
