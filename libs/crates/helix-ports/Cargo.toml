[package]
name = "helix-ports"
version = "0.1.0"
edition = "2021"
description = "Hexagonal architecture port interfaces: Ports, Adapters, and Composition"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phenotype-dev/helix-ports"
documentation = "https://docs.helix.dev/helix-ports"
readme = "README.md"
keywords = ["hexagonal", "ports", "adapters", "clean-architecture", "ports-and-adapters"]
categories = ["architecture", "development-tools"]
rust-version = "1.70"

[features]
default = ["async", "serde"]
async = ["tokio/rt", "dep:async-trait"]
serde = ["dep:serde"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["sync"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }

# Async traits
async-trait = { version = "0.1", optional = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "macros"] }

[lib]
name = "helix_ports"
path = "src/lib.rs"
