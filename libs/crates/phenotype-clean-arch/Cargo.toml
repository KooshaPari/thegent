[package]
name = "phenotype-clean-arch"
version = "0.1.0"
edition = "2021"
description = "Clean Architecture primitives for Phenotype ecosystem"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phenotype/phenotype-clean-arch"
readme = "README.md"

[features]
default = ["std"]
std = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "macros"] }

[[example]]
name = "todo_service"
path = "examples/todo_service.rs"
