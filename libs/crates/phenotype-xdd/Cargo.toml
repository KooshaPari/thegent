[package]
name = "phenotype-xdd"
version = "0.1.0"
edition = "2021"
description = "xDD Best Practices Library - TDD, BDD, DDD, and more"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phenotype/phenotype-xdd"
readme = "README.md"
keywords = ["tdd", "bdd", "ddd", "cqrs", "event-sourcing", "xdd", "testing"]
categories = ["development-tools", "testing"]

[features]
default = ["std"]
std = []

[dependencies]
# For async testing
tokio = { version = "1.0", features = ["rt", "macros", "test-util"] }

# Async traits
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Unique IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
# Property-based testing
proptest = "1.0"

[[example]]
name = "tdd_order"
path = "examples/tdd_order.rs"

[[example]]
name = "bdd_calculator"
path = "examples/bdd_calculator.rs"

[[example]]
name = "ddd_ecommerce"
path = "examples/ddd_ecommerce.rs"

[[example]]
name = "cqrs_bank"
path = "examples/cqrs_bank.rs"

[[example]]
name = "event_sourcing_todo"
path = "examples/event_sourcing_todo.rs"
