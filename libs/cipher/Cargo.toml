[package]
name = "cipher"
version = "0.1.0"
edition = "2021"
description = "Simple, safe cryptography utilities for Rust"
license = "MIT"
repository = "https://github.com/phenotype-dev/cipher"
readme = "README.md"
keywords = ["cryptography", "encryption", "hashing", "signatures"]
categories = ["cryptography", "security"]

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
blake2 = "0.10"
ed25519-dalek = "2.0"
rand = "0.8"
thiserror = "1.0"
