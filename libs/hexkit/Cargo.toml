[package]
name = "hexkit"
version = "1.0.0"
edition = "2021"
authors = ["Phenotype <dev@phenotype.dev>"]
description = "Hexagonal Architecture toolkit for Rust"
keywords = ["hexagonal-architecture", "ports-and-adapters", "ddd"]
categories = ["architecture"]
license = "MIT OR Apache-2.0"

[features]
default = ["tokio", "async-trait", "serde"]
serde = ["dep:serde", "dep:serde_json"]
tokio = ["dep:tokio"]
async-trait = ["dep:async-trait"]
full = ["serde", "tokio", "async-trait"]

[dependencies]
thiserror = "1.0"
async-trait = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.0", features = ["sync"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
