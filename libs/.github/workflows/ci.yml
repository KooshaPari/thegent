name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        if: hashFiles('**/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@v1

      - name: Setup Go
        if: hashFiles('**/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Python
        if: hashFiles('**/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Rust
        if: hashFiles('**/Cargo.toml') != ''
        run: cargo test --workspace --all-features 2>/dev/null || echo "No cargo test"

      - name: Test Go
        if: hashFiles('**/go.mod') != ''
        run: go test ./... 2>/dev/null || echo "No go test"

      - name: Test Python
        if: hashFiles('**/pyproject.toml') != ''
        run: pip install -e . 2>/dev/null && pytest 2>/dev/null || echo "No python test"

      - name: Test TypeScript
        if: hashFiles('**/package.json') != ''
        run: npm ci 2>/dev/null && npm test 2>/dev/null || echo "No npm test"
