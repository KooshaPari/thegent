version: '3'

vars:
  HAS_PYTHON:
    sh: |
      find . \
        -path './.git' -prune -o \
        -path './.venv' -prune -o \
        -path './node_modules' -prune -o \
        -path './templates' -prune -o \
        -path './.archive' -prune -o \
        -path './.cache' -prune -o \
        -path './.pytest_cache' -prune -o \
        -path './.ruff_cache' -prune -o \
        -path './.mypy_cache' -prune -o \
        -path './build' -prune -o \
        -path './dist' -prune -o \
        -path './target' -prune -o \
        -path './coverage' -prune -o \
        -name pyproject.toml -print -quit | grep -q . && echo 1 || echo 0
  HAS_RUST:
    sh: |
      find . \
        -path './.git' -prune -o \
        -path './.venv' -prune -o \
        -path './node_modules' -prune -o \
        -path './templates' -prune -o \
        -path './.archive' -prune -o \
        -path './.cache' -prune -o \
        -path './.pytest_cache' -prune -o \
        -path './.ruff_cache' -prune -o \
        -path './.mypy_cache' -prune -o \
        -path './build' -prune -o \
        -path './dist' -prune -o \
        -path './target' -prune -o \
        -path './coverage' -prune -o \
        -name Cargo.toml -print -quit | grep -q . && echo 1 || echo 0
  HAS_JAVASCRIPT:
    sh: |
      find . \
        -path './.git' -prune -o \
        -path './.venv' -prune -o \
        -path './node_modules' -prune -o \
        -path './templates' -prune -o \
        -path './.archive' -prune -o \
        -path './.cache' -prune -o \
        -path './.pytest_cache' -prune -o \
        -path './.ruff_cache' -prune -o \
        -path './.mypy_cache' -prune -o \
        -path './build' -prune -o \
        -path './dist' -prune -o \
        -path './target' -prune -o \
        -path './coverage' -prune -o \
        -name package.json -print -quit | grep -q . && echo 1 || echo 0
  HAS_GO:
    sh: |
      find . \
        -path './.git' -prune -o \
        -path './.venv' -prune -o \
        -path './node_modules' -prune -o \
        -path './templates' -prune -o \
        -path './.archive' -prune -o \
        -path './.cache' -prune -o \
        -path './.pytest_cache' -prune -o \
        -path './.ruff_cache' -prune -o \
        -path './.mypy_cache' -prune -o \
        -path './build' -prune -o \
        -path './dist' -prune -o \
        -path './target' -prune -o \
        -path './coverage' -prune -o \
        -name go.mod -print -quit | grep -q . && echo 1 || echo 0
  HAS_SHELL:
    sh: |
      find . \
        -path './.git' -prune -o \
        -path './.venv' -prune -o \
        -path './node_modules' -prune -o \
        -path './templates' -prune -o \
        -path './.archive' -prune -o \
        -path './.cache' -prune -o \
        -path './.pytest_cache' -prune -o \
        -path './.ruff_cache' -prune -o \
        -path './.mypy_cache' -prune -o \
        -path './build' -prune -o \
        -path './dist' -prune -o \
        -path './target' -prune -o \
        -path './coverage' -prune -o \
        -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' \) -print -quit | grep -q . && echo 1 || echo 0
  VALE_INVARIANT_DOCS: >-
    docs/reference/CANONICAL_INVARIANT_PROSE.md
    docs/research/LANGUAGE_INVARIANTS_AND_VALE_2026-03.md
    docs/research/EXTERNAL_SIGNALS_ZDR_MESH_SECRETS_2026-03.md
    docs/research/SECRETS_MINIMAX_CLIPROXY_MESH_RUNBOOK_2026-03-29.md
    docs/governance/TACH_MONOLITH_BOUNDARY.md

tasks:
  default:
    desc: Show detected language surfaces and list available tasks
    cmds:
      - task: detect
      - task --list

  detect:
    desc: Show detected language surfaces used by common tasks
    cmds:
      - |
        set -euo pipefail
        detected=""

        if [ "{{.HAS_PYTHON}}" = "1" ]; then
          detected="${detected} python"
        fi

        if [ "{{.HAS_RUST}}" = "1" ]; then
          detected="${detected} rust"
        fi

        if [ "{{.HAS_JAVASCRIPT}}" = "1" ]; then
          detected="${detected} javascript"
        fi

        if [ "{{.HAS_GO}}" = "1" ]; then
          detected="${detected} go"
        fi

        if [ "{{.HAS_SHELL}}" = "1" ]; then
          detected="${detected} shell"
        fi

        if [ -z "$detected" ]; then
          echo "Detected language surfaces: none"
          exit 1
        fi

        echo "Detected language surfaces:${detected}"

  build:
    desc: Build detected project surfaces
    cmds:
      - task: detect
      - |
        set -euo pipefail
        found=0

        if [ "{{.HAS_PYTHON}}" = "1" ]; then
          uv build
          found=1
        fi

        if [ "{{.HAS_RUST}}" = "1" ]; then
          if [ -f Cargo.toml ] && cargo metadata --no-deps >/dev/null 2>&1; then
            cargo build --workspace
          elif [ -f crates/Cargo.toml ] && (cd crates && cargo metadata --no-deps >/dev/null 2>&1); then
            (cd crates && cargo build --workspace)
          else
            echo "Rust manifests detected, but no buildable workspace root was found; skipping Rust build" >&2
          fi
          found=1
        fi

        if [ "{{.HAS_JAVASCRIPT}}" = "1" ]; then
          bun run docs:build
          found=1
        fi

        if [ "{{.HAS_GO}}" = "1" ]; then
          find . \
            -path './.git' -prune -o \
            -path './.venv' -prune -o \
            -path './node_modules' -prune -o \
            -path './templates' -prune -o \
            -path './.archive' -prune -o \
            -name go.mod -print |
          while IFS= read -r gomod; do
            module_dir="$(dirname "$gomod")"
            (cd "$module_dir" && go build ./...)
          done
          found=1
        fi

        if [ "$found" -eq 0 ]; then
          echo "No supported build surface detected" >&2
          exit 1
        fi

  test:
    desc: Run detected test suites
    cmds:
      - task: detect
      - |
        set -euo pipefail

        found=0

        if [ "{{.HAS_PYTHON}}" = "1" ]; then
          uv run pytest
          found=1
        fi

        if [ "{{.HAS_RUST}}" = "1" ]; then
          if [ -f Cargo.toml ] && cargo metadata --no-deps >/dev/null 2>&1; then
            cargo test --workspace
          elif [ -f crates/Cargo.toml ] && (cd crates && cargo metadata --no-deps >/dev/null 2>&1); then
            (cd crates && cargo test --workspace)
          else
            echo "Rust manifests detected, but no buildable workspace root was found; skipping Rust tests" >&2
          fi
          found=1
        fi

        if [ "{{.HAS_JAVASCRIPT}}" = "1" ]; then
          if [ -f scripts/validate-code-examples.py ]; then
            bun run docs:validate
          else
            echo "JavaScript manifests detected, but scripts/validate-code-examples.py is missing; skipping docs validation" >&2
          fi
          found=1
        fi

        if [ "{{.HAS_GO}}" = "1" ]; then
          find . \
            -path './.git' -prune -o \
            -path './.venv' -prune -o \
            -path './node_modules' -prune -o \
            -path './templates' -prune -o \
            -path './.archive' -prune -o \
            -name go.mod -print |
          while IFS= read -r gomod; do
            module_dir="$(dirname "$gomod")"
            (cd "$module_dir" && go test ./...)
          done
          found=1
        fi

        if [ "$found" -eq 0 ]; then
          echo "No supported test surface detected" >&2
          exit 1
        fi

  lint:
    desc: Run detected lint checks
    cmds:
      - task: detect
      - |
        set -euo pipefail

        found=0

        if [ "{{.HAS_PYTHON}}" = "1" ]; then
          uv run ruff check src tests
          found=1
        fi

        if [ "{{.HAS_RUST}}" = "1" ]; then
          if [ -f Cargo.toml ] && cargo metadata --no-deps >/dev/null 2>&1; then
            cargo fmt --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          elif [ -f crates/Cargo.toml ] && (cd crates && cargo metadata --no-deps >/dev/null 2>&1); then
            (cd crates && cargo fmt --check && cargo clippy --workspace --all-targets --all-features -- -D warnings)
          else
            echo "Rust manifests detected, but no buildable workspace root was found; skipping Rust lint" >&2
          fi
          found=1
        fi

        if [ "{{.HAS_JAVASCRIPT}}" = "1" ]; then
          if [ -f scripts/check-docs-links.py ]; then
            bun run docs:links
          else
            echo "JavaScript manifests detected, but scripts/check-docs-links.py is missing; skipping docs link lint" >&2
          fi
          found=1
        fi

        if [ "{{.HAS_GO}}" = "1" ]; then
          find . \
            -path './.git' -prune -o \
            -path './.venv' -prune -o \
            -path './node_modules' -prune -o \
            -path './templates' -prune -o \
            -path './.archive' -prune -o \
            -name go.mod -print |
          while IFS= read -r gomod; do
            module_dir="$(dirname "$gomod")"
            unformatted="$(find "$module_dir" -name '*.go' -not -path '*/vendor/*' -exec gofmt -l {} +)"
            if [ -n "$unformatted" ]; then
              echo "$unformatted"
              exit 1
            fi
            (cd "$module_dir" && go vet ./...)
          done
          found=1
        fi

        if [ "{{.HAS_SHELL}}" = "1" ]; then
          if command -v shellcheck >/dev/null 2>&1; then
            shell_files="$(mktemp)"
            trap 'rm -f "$shell_files"' EXIT

            while IFS= read -r -d '' file; do
              if [ "${file##*.}" = "zsh" ] || head -n 1 "$file" | grep -Eq '(^#!.*zsh$|^#!.*/zsh[[:space:]]|^#!/bin/zsh$)'; then
                continue
              fi

              printf '%s\n' "$file" >> "$shell_files"
            done < <(
              find . \
                -path './.git' -prune -o \
                -path './.venv' -prune -o \
                -path './node_modules' -prune -o \
                -path './templates' -prune -o \
                -path './.archive' -prune -o \
                -path './.cache' -prune -o \
                -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' \) -print0
            )

            if [ -s "$shell_files" ]; then
              xargs shellcheck -S error < "$shell_files"
            else
              echo "Shell scripts detected, but no ShellCheck-supported sh/bash files were found; skipping shell lint" >&2
            fi
          else
            echo "Shell scripts detected, but shellcheck is not installed; skipping shell lint" >&2
          fi
          found=1
        fi

        if [ "$found" -eq 0 ]; then
          echo "No supported lint surface detected" >&2
          exit 1
        fi

  clean:
    desc: Remove generated caches and build artifacts
    cmds:
      - |
        set -euo pipefail

        for path in \
          .pytest_cache \
          .ruff_cache \
          .mypy_cache \
          .hypothesis \
          .nox \
          .tox \
          .ty \
          .pyright \
          .coverage \
          coverage.xml \
          htmlcov \
          build \
          dist \
          docs/.vitepress/cache \
          docs/.vitepress/dist \
          node_modules/.vite \
          target \
          crates/target
        do
          [ ! -e "$path" ] && [ ! -L "$path" ] && continue
          rm -rf "$path"
        done

        find . \
          -path './.git' -prune -o \
          -path './.venv' -prune -o \
          -path './node_modules' -prune -o \
          -path './templates' -prune -o \
          -path './.archive' -prune -o \
          -name '*.egg-info' -prune -exec rm -rf {} +

        find . \
          -path './.git' -prune -o \
          -path './.venv' -prune -o \
          -path './node_modules' -prune -o \
          -path './templates' -prune -o \
          -path './.archive' -prune -o \
          -type d -name __pycache__ -prune -exec rm -rf {} +

  check:
    desc: Run common build, test, and lint tasks for detected language surfaces
    cmds:
      - task: build
      - task: test
      - task: lint

  tach:
    desc: Enforce Tach module boundaries (monolith thegent + forbid cycles between modules)
    cmds:
      - uv run tach check

  vale:
    desc: Vale invariant Markdown (canonical prose, mesh signals, Tach governance)
    cmds:
      - vale {{.VALE_INVARIANT_DOCS}}

  vale:install:
    desc: Install Vale on macOS via Homebrew (no-op if already present)
    cmds:
      - command -v vale >/dev/null 2>&1 || brew install vale

  ruff:
    desc: Ruff lint on src/ and tests/
    cmds:
      - uv run ruff check src tests

  ruff:format:
    desc: Ruff format check (no write)
    cmds:
      - uv run ruff format --check src tests

  test:phenotype-cliproxy:
    desc: Unit tests for CLIProxy /v1/models invariant helper
    cmds:
      - uv run pytest tests/unit/test_phenotype_cliproxy_models_check.py -q

  check:cliproxy-models:
    desc: Live check against local CLIProxy (8317); fails if proxy is down
    cmds:
      - uv run python scripts/phenotype_cliproxy_models_check.py

  quality:max-lines:
    desc: WL-122 polyglot max-lines gate (changed files unless MAX_LINES_SCOPE=all)
    cmds:
      - MAX_LINES=${MAX_LINES:-2500} WARN_LINES=${WARN_LINES:-2000} MAX_LINES_SCOPE=${MAX_LINES_SCOPE:-changed} MAX_LINES_EXCLUDE_PREFIXES=${MAX_LINES_EXCLUDE_PREFIXES:-.git,node_modules,dist,build,target,.venv,__pycache__,docs/.vitepress/dist,docs-dist,.shadow-,crates/thegent-hooks/src/main.rs,hooks/hook-dispatcher/src/main.rs,hooks/governance-gates.sh,src/thegent/integrations/workstream_autosync.py,src/thegent/execution.py} sh scripts/max-lines-gate.sh

  quality:sitback-contracts:
    desc: Sitback routing contracts harness (CI wiring; stub until contracts wired)
    cmds:
      - 'echo "[stub] quality:sitback-contracts OK"'

  quality:harness-model-contracts:
    desc: Harness model mapping contracts (CI wiring; stub until contracts wired)
    cmds:
      - 'echo "[stub] quality:harness-model-contracts OK"'

  quality:fast:
    desc: Tach + Vale only (pre-push quick gate)
    cmds:
      - task: tach
      - task: vale

  quality:
    desc: Max-lines + Tach + Vale + ruff + phenotype cliproxy unit tests
    cmds:
      - task: quality:max-lines
      - task: tach
      - task: vale
      - task: ruff
      - task: test:phenotype-cliproxy

  quality:full:
    desc: quality + ruff format check
    cmds:
      - task: quality
      - task: ruff:format

  all:
    desc: Alias for quality (boundaries + docs + lint + focused tests)
    cmds:
      - task: quality

  landing:install:
    desc: Install the repo-owned thegent landing app dependencies
    dir: apps/landing
    cmds:
      - bun install

  landing:dev:
    desc: Run the repo-owned thegent landing app locally
    dir: apps/landing
    cmds:
      - bun run dev

  landing:build:
    desc: Build the repo-owned thegent landing app
    dir: apps/landing
    cmds:
      - bun run build

  landing:preview:
    desc: Preview the built thegent landing app
    dir: apps/landing
    cmds:
      - bun run preview
  grade:
    desc: Full grade (strictest — no caching)
    cmds:
      - ./grade.sh

  grade-fast:
    desc: Fast grade (skips heavy checks)
    cmds:
      - ./grade.sh --fast

  grade-json:
    desc: Grade with JSON output
    cmds:
      - ./grade.sh --json

  grade-html:
    desc: Grade with HTML report
    cmds:
      - ./grade.sh --html

  install-lefthook:
    desc: Install lefthook git hooks
    cmds:
      - lefthook install
    status:
      - test -f .git/hooks/lefthook

