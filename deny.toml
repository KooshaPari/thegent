[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # No safe upgrade is available; transitive through ratatui/compio.
    "RUSTSEC-2024-0436",
    # No patched rsa release is available; MAIF rejects weak RSA keys while migration is tracked.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-3-Clause", "BSD-2-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "MPL-2.0", "Zlib", "CC0-1.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
