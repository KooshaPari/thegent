openapi: 3.1.0
info:
  title: atomsAgent API
  version: 0.1.0
paths:
  /v1/chat/completions:
    post:
      tags:
      - openai
      summary: Create Chat Completion
      description: 'Create a chat completion with JWT authentication.


        Supports two modes:

        1. JWT Authentication (preferred): Extract user context from WorkOS JWT token

        2. Legacy Mode: Extract user context from request metadata (backward compatibility)


        Priority: JWT authentication > metadata'
      operationId: create_chat_completion_v1_chat_completions_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models:
    get:
      tags:
      - openai
      summary: List Models
      description: 'List available models.


        This endpoint supports optional JWT authentication for user context.'
      operationId: list_models_v1_models_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/embeddings:
    post:
      tags:
      - embeddings
      summary: Create Embeddings
      description: "Generate embeddings using Vertex AI.\n\nOpenAI-compatible endpoint\
        \ that supports:\n- Single or batch embedding generation (up to 100 inputs)\n\
        - Task-type optimization (RETRIEVAL_DOCUMENT, RETRIEVAL_QUERY, etc.)\n- Configurable\
        \ output dimensions (768, 1536, or 3072)\n- Pre-normalized embeddings for\
        \ 3072 dimensions\n\nArgs:\n    request: Embedding request with input text(s)\
        \ and options\n    authenticated_user: Optional authenticated user (for logging/analytics)\n\
        \    embedding_service: Vertex AI embedding service\n\nReturns:\n    EmbeddingResponse\
        \ with embeddings and usage information"
      operationId: create_embeddings_v1_embeddings_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/files:
    post:
      tags:
      - files
      summary: Upload one or more files for Agent workflows
      description: 'Persist uploaded files for downstream Agent workflows.


        Files are provided as base64 encoded payloads to avoid multipart handling
        in clients.

        Uploaded files are stored on disk and metadata is returned to the caller.'
      operationId: upload_files_v1_files_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /atoms/chat/sessions:
    get:
      tags:
      - chat
      summary: List Chat Sessions
      operationId: list_chat_sessions_atoms_chat_sessions_get
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: User identifier
          title: User Id
        description: User identifier
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
