        \   \"content\": \"base64-encoded-content\",\n    \"encoding\": \"base64\"\
        ,\n    \"size\": 12345,\n    \"metadata\": {}\n}"
      operationId: process_document_vertex_ocr_process_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Process Document Vertex Ocr Process Post
        '422':
