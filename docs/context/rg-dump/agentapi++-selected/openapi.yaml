        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: User identifier
          title: User Id
        description: User identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddServerRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Add Server To Session Atoms Chat Sessions  Session
                  Id  Servers Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /atoms/chat/sessions/{session_id}/servers/{server_id}:
    delete:
      tags:
      - chat
      summary: Remove Server From Session
      description: Remove MCP server from session.
      operationId: remove_server_from_session_atoms_chat_sessions__session_id__servers__server_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Server Id
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: User identifier
          title: User Id
        description: User identifier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Remove Server From Session Atoms Chat Sessions  Session
                  Id  Servers  Server Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
