  /vertex-ocr/ocr/tasks:
    post:
      tags:
      - vertex-ocr
      summary: Create Ocr Task
      description: "Create a new OCR task.\n\nExpected request body:\n{\n    \"file_url\"\
        : \"https://...\",\n    \"file_base64\": \"base64-encoded-content\",\n   \
        \ \"file_name\": \"document.pdf\",\n    \"processor_id\": \"optional-processor-id\"\
        ,\n    \"options\": {\n        \"language\": \"en\",\n        \"output_format\"\
        : \"text\",\n        \"include_confidence\": true,\n        \"include_bounding_boxes\"\
        : true\n    }\n}"
      operationId: create_ocr_task_vertex_ocr_ocr_tasks_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Request
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Ocr Task Vertex Ocr Ocr Tasks Post
        '422':
