        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: User identifier
          title: User Id
        description: User identifier
      responses:
        '200':
          description: Successful Response
          content:
