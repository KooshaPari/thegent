          title: Session Id
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: User identifier
          title: User Id
        description: User identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateToolPermissionsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Tool Permissions Atoms Chat Sessions  Session
