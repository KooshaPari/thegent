[package]
name = "thegent-hooks"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust hook runtime core subcommands for thegent"

[[bin]]
name = "thegent-hooks"
path = "src/main.rs"

[[bin]]
name = "quality-gate"
path = "src/bin/quality-gate.rs"

[[bin]]
name = "security-pipeline"
path = "src/bin/security-pipeline.rs"

[[bin]]
name = "stop-reconcile"
path = "src/bin/stop-reconcile.rs"

[[bin]]
name = "spec-verifier"
path = "src/bin/spec-verifier.rs"

[[bin]]
name = "pre-write-validator"
path = "src/bin/pre-write-validator.rs"

[[bin]]
name = "qa-policy-test"
path = "src/bin/qa-policy-test.rs"

[[bin]]
name = "task-completion-verifier"
path = "src/bin/task-completion-verifier.rs"

[[bin]]
name = "post-edit-checker"
path = "src/bin/post-edit-checker.rs"

[[bin]]
name = "complexity-ratchet"
path = "src/bin/complexity-ratchet.rs"

[dependencies]
ignore = "0.4"
jsonschema = "0.46"
tokio = { version = "1.40", features = ["rt", "process", "sync", "time", "rt-multi-thread", "io-util"] }
futures = "0.3"
blake3 = "1.6.1"
base16ct = "1.0.0"
libc = "0.2.170"
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = "1.0.101"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
regex = "1.11.1"
dashmap = "7.0.0-rc2"
walkdir = "2.5.0"
glob = "0.3.2"
rayon = "1.10.0"
colored = "3.0.0"
thiserror = "2.0.18"
which = "8.0.2"
tempfile = "3"
toml = "1.1"

[features]
default = []

[dev-dependencies]
tempfile = "3"
