[package]
name = "thegent-hooks"
version = "0.1.0"
edition = "2021"
description = "Rust hook runtime core subcommands for thegent"

[[bin]]
name = "thegent-hooks"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
jsonschema = "0.26"
tokio = { version = "1.40", features = ["rt", "process", "sync", "time", "rt-multi-thread", "io-util"] }
futures = "0.3"
blake3 = "1.6.1"
base16ct = "1.0.0"
libc = "0.2.170"
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = "1.0.101"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
regex = "1.11.1"
dashmap = "7.0.0-rc2"
walkdir = "2.5.0"
glob = "0.3.2"
rayon = "1.10.0"
colored = "3.0.0"
thegent-git = { path = "../thegent-git" }
thiserror = "2.0.18"
lazy_static = "1.5.0"
which = "6.0.3"
tempfile = "3"
toml = "0.8"

[features]
default = []
gix = ["thegent-git/gix"]

[dev-dependencies]
tempfile = "3"
