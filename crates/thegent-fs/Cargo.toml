[package]
name = "thegent-fs"
version = "0.1.0"
edition = "2021"
description = "BKM-??: thegent-fs high-performance file operations (copy, move, glob)"

[[bin]]
name = "thegent-fs"
path = "src/main.rs"

[lib]
name = "thegent_fs"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs4 = "0.8"
pyo3 = { version = "0.24.1", optional = true, features = ["abi3-py312", "extension-module"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[features]
default = []
pyo3 = ["dep:pyo3"]

[dev-dependencies]
tempfile = "3"
