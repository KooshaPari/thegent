[package]
name = "thegent-watcher"
version = "0.1.0"
edition = "2021"
description = "BKM-09: Global Rust-based file watcher (notify-based) CLI"

# This is a binary crate (standalone CLI tool), not a library
# Library functionality is provided by thegent/sitback/watchdog.py (pure Python)

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
notify = "8.0.0"
crossbeam-channel = "0.5.14"
clap = { version = "4.5.59", features = ["derive"] }
anyhow = "1.0.101"
