[package]
name = "thegent-crypto"
version = "0.1.0"
edition = "2021"
description = "BKM-03: Sign/verify/hash artifacts for thegent (PyO3)"
license = "MIT"
repository = "https://github.com/KooshaPari/thegent"
keywords = ["crypto", "hmac", "sha2"]
categories = ["cryptography", "security"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24.1", optional = true, features = ["abi3-py312", "extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
hmac = "0.12.1"
sha2 = "0.10.8"
base16ct = "1.0.0"
subtle = "2.6.1"

[features]
default = []
python = ["pyo3"]
