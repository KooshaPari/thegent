# Tach - Layer Type Checker Configuration
# Circular Dependency Enforcement for thegent/crates workspace

[settings]
# Enable strict layer checking
forbid_outside_layer_dependencies = true
forbid_circular_dependencies = true

# Warn on unused layer dependencies (strict mode)
warn_on_unused_config = true

# Allow modules to depend on themselves (for edge cases)
allow_self_dependencies = true

# Forbidden circular dependencies documentation:
# These cycles need to be resolved or documented with exceptions:
#
# 1. contracts ↔ output_parser
# 2. cli hub dependencies (cli depends on execution, agents, models)
# 3. routing ↔ models
# 4. models ↔ agents
# 5. execution ↔ agents
# 6. planning hub (planning depends on routing, models, cli, execution)
# 7-8. Additional hub cycles
#
# Resolution Strategy:
# 1. Extract port interfaces to shared crate (e.g., thegent-ports)
# 2. Use dependency inversion to break cycles
# 3. Document exceptions with #[allow(circular_dependencies)]

# Layer definitions
[layers]
# Example layers (customize based on actual architecture)
core = ["thegent-*"]
adapters = ["*adapter", "*client"]
infrastructure = ["*persistence", "*storage"]

# Allow certain cross-layer dependencies
[allowed_dependencies]
# adapter can use core
"adapter:*" = ["core:*"]
# infrastructure can use core and adapter
"infrastructure:*" = ["core:*", "adapter:*"]
