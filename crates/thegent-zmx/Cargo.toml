[package]
name = "thegent-zmx"
version = "0.1.0"
edition = "2021"
description = "Idiomatic Rust wrapper around the zmx session manager (C ABI)"
authors = ["thegent"]
license = "MIT"

[features]
default = []
zmx-native = ["thegent-zmx-interop/zmx-native"]
live-zmx = []

[dependencies]
thegent-zmx-interop = { path = "../thegent-zmx-interop", version = "0.1.0" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
