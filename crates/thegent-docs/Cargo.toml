[package]
name = "thegent-docs"
version = "0.1.0"
edition = "2021"
description = "Markdown frontmatter/backmatter processor and documentation tools"

[[bin]]
name = "thegent-docs"
path = "src/main.rs"

[[bin]]
name = "audit-md-structure"
path = "src/bin/audit-md-structure.rs"

[lib]
name = "thegent_docs"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0.149"
clap = { version = "4.5.59", features = ["derive"] }
anyhow = "1.0"
walkdir = "2"
regex = "1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
