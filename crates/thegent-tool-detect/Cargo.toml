[package]
name = "thegent-tool-detect"
version = "0.1.0"
edition = "2021"
description = "Fast tool detection with caching for thegent hooks"

[lib]
name = "thegent_tool_detect"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "thegent-tool-detect"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
which = "6"
pyo3 = { version = "0.24.1", optional = true, features = ["abi3-py312", "extension-module"] }
rayon = "1.11.0"
harness_tool_detect = { path = "../../../heliosCLI/crates/harness_tool_detect" }

[features]
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
