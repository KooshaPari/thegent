[workspace]
resolver = "2"
members = [
    "thegent-resources",
    "thegent-parser",
    "thegent-crypto",
    "thegent-shm",
    "thegent-git",
    "thegent-discovery",
    "thegent-cache",
    "thegent-hooks",
    "thegent-docs",
    "thegent-utils",
    "thegent-router",
    "thegent-maif",
    "thegent-shims",
    "thegent-zmx-interop",
    "thegent-zmx",
    "thegent-jsonl",
    "thegent-policy",
    "thegent-metrics",
    "thegent-fs",
    "thegent-offload",
    "harness-native",
    "thegent-tui",
    "thegent-memory",
    "thegent-subprocess",
    "phenotype-cache-adapter",
]
exclude = ["thegent-watcher"]

# ---------------------------------------------------------------------------
# Workspace-level dependencies
# Crates should prefer `gix.workspace = true` over duplicating the version.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Pure-Rust git library (gitoxide). Preferred over git2/libgit2 for all new
# Rust crates. Use `max-performance-safe` for portable SIMD acceleration.
gix = { version = "0.79.0", default-features = false, features = ["max-performance-safe"] }
which = "6.0"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1

[profile.release.package."thegent-resources"]
opt-level = "z"
strip = true

[profile.release.package."thegent-shm"]
opt-level = "z"
strip = true

[profile.release.package."thegent-git"]
opt-level = 3

[profile.release.package."thegent-discovery-rs"]
opt-level = 3

[profile.release.package."thegent-path-resolve"]
opt-level = "z"
strip = true

[profile.release.package."thegent-router"]
opt-level = 3

[profile.release.package."thegent-tool-detect"]
opt-level = "z"
strip = true

[profile.release.package."thegent-tui"]
opt-level = "z"
strip = true

[profile.release.package."thegent-shims"]
opt-level = "z"
strip = true

[profile.release.package."thegent-runtime"]
opt-level = "z"
strip = true
