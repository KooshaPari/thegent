[workspace]
resolver = "2"
members = [
    "harness-native",
    "thegent-benchmark",
    "thegent-cache",
    "thegent-metrics",
    "thegent-plugin-host",
    "thegent-subprocess",
    "thegent-shm",
]
exclude = [
    "thegent-tool-detect",
    "thegent-crypto",
    "thegent-fs",
    "thegent-jsonl",
    "thegent-utils",
    "thegent-resources",
    "thegent-path-resolve",
]

[workspace.dependencies]
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.dev]
opt-level = 0
