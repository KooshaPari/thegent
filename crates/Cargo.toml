[workspace]
resolver = "2"
members = [
    "thegent-resources",
    "thegent-parser",
    "thegent-crypto",
    "thegent-shm",
    "thegent-git",
    "thegent-discovery",
    # "thegent-cache",  # TEMPORARILY DISABLED - git conflicts
    "thegent-hooks",
    "thegent-docs",
    "thegent-utils",
    "thegent-router",
    "thegent-maif",
    "thegent-shims",
    "thegent-zmx-interop",
    "thegent-zmx",
    "thegent-jsonl",
    "thegent-policy",
    "thegent-metrics",
    "thegent-fs",
    "thegent-offload",
    "harness-native",
    "thegent-tui",
    "thegent-memory",
    "thegent-subprocess",
    "thegent-plugin-host",
]
exclude = ["thegent-watcher"]

# ---------------------------------------------------------------------------
# Workspace-level dependencies
# Crates should prefer `gix.workspace = true` over duplicating the version.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Pure-Rust git library (gitoxide). Preferred over git2/libgit2 for all new
# Rust crates. Use `max-performance-safe` for portable SIMD acceleration.
gix = { version = "0.79.0", default-features = false, features = ["max-performance-safe"] }
which = "6.0"
criterion = "0.5"
derive_more = "1.0"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
