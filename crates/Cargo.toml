[workspace]
resolver = "2"
members = [
    "thegent-resources",
    "thegent-parser",
    "thegent-crypto",
    "thegent-shm",
    "thegent-git",
    "thegent-discovery",
    "thegent-cache",
    "thegent-hooks",
    "thegent-docs",
    "thegent-utils",
    "thegent-router", "supermemory-rs",
    "thegent-maif",
    "thegent-shims",
    "thegent-zmx-interop",
    "thegent-zmx",
    "thegent-jsonl",
    "thegent-offload",
    "harness-native",
]
exclude = ["thegent-watcher"]

# ---------------------------------------------------------------------------
# Workspace-level dependencies
# Crates should prefer `gix.workspace = true` over duplicating the version.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Pure-Rust git library (gitoxide). Preferred over git2/libgit2 for all new
# Rust crates. Use `max-performance-safe` for portable SIMD acceleration.
gix = { version = "0.79.0", default-features = false, features = ["max-performance-safe"] }
