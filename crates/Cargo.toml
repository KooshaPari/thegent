[workspace]
resolver = "2"
members = [
    "harness-native",
    "thegent-benchmark",
    "thegent-cli",
    "thegent-shm",
    "thegent-cache",
    "thegent-mesh",
    "thegent-subprocess",
    "thegent-metrics",
    "thegent-plugin-host",
    "thegent-sharecli",
    "thegent-tool-detect",
]

[workspace.dependencies]
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.dev]
opt-level = 0
