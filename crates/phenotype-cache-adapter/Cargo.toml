[package]
name = "phenotype-cache-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generic two-tier cache with L1 (LRU) + L2 (DashMap), TTL expiration, and metrics hooks"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }

# Cache implementations
dashmap = "6.1"
lru = "0.16"
parking_lot = "0.12"
moka = { version = "0.12", features = ["sync", "future"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
