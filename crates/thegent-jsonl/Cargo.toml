[package]
name = "thegent-jsonl"
version = "0.1.0"
edition = "2021"
description = "BKM-10: thegent-jsonl streaming JSONL parser (Rust binary + library)"

[[bin]]
name = "thegent-jsonl"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "thegent_jsonl"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.149"
anyhow = "1.0.101"
clap = { version = "4.5", features = ["derive"], optional = true }
pyo3 = { version = "0.23.4", features = ["extension-module"] }
blake3 = "1.6"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
cli = ["dep:clap"]
