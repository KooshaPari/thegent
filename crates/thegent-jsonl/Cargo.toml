[package]
name = "thegent-jsonl"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BKM-10: thegent-jsonl streaming JSONL parser (Rust binary + library)"

[[bin]]
name = "thegent-jsonl"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
rsa = { version = "0.9.7", features = ["sha2"] }
pkcs8 = { version = "0.10.2", features = ["pem"] }
sha2 = "0.10.9"
base64 = "0.22.1"
thiserror = "2.0.18"
anyhow = "1.0"
rand = "0.10.1"
clap = { version = "4.5.59", features = ["derive"] }
blake3 = "1.5"

[dev-dependencies]
tempfile = "3.9"
