[package]
name = "thegent-resources"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BKM-01: Native FD/memory/load sampling for thegent"

[[bin]]
name = "thegent-resources"
path = "src/bin.rs"

[lib]
name = "thegent_resources"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
libc = "0.2"
pyo3 = { version = "0.28.3", optional = true, features = ["abi3-py312", "extension-module"] }

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
overflow-checks = false
