[package]
name = "thegent-runtime"
version = "0.2.0"
edition = "2021"
description = "Unified runtime dispatch binary: consolidates all tool shims (find, grep, git, cat, etc.)"

[[bin]]
name = "runtime-dispatch"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base16ct = "1.0"
which = "6.0"
libc = "0.2"
nix = "0.28"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
