[package]
name = "thegent-policy"
version = "0.2.0"
edition = "2021"
description = "Policy engine and compliance evaluation for thegent governance"

[lib]
name = "thegent_policy"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
dashmap = "6.1"
regex = "1.11"
pyo3 = { version = "0.24.1", optional = true, features = ["abi3-py312", "extension-module"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
python = ["dep:pyo3"]
