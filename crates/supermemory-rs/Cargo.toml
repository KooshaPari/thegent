[package]
name = "supermemory-rs"
version = "0.1.0"
edition = "2021"
authors = ["thegent team"]
description = "Rust client library for Supermemory.ai"
repository = "https://github.com/thegent-ai/thegent"
license = "MIT"

[dependencies]
reqwest = { version = "0.12.11", features = ["json"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
thiserror = "2.0.18"
log = "0.4.29"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = "1.0.101"

[dev-dependencies]
tokio-test = "0.4.5"
mockito = "1.7.2"
tempfile = "3.17.1"
