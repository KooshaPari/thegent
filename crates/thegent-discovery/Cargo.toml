[package]
name = "thegent-discovery-rs"
version = "0.1.0"
edition = "2021"
description = "Agent discovery using shell commands for system monitoring"

[lib]
name = "thegent_discovery"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
regex = "1.11.1"
pyo3 = { version = "0.28.2", features = ["extension-module"] }

[project]
name = "thegent_discovery_rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
