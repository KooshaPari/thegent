[package]
name = "thegent-discovery-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Agent discovery using shell commands for system monitoring"

[[bin]]
name = "thegent-discovery"
path = "src/main.rs"

strip = true
[lib]
name = "thegent_discovery"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.17.0", features = ["serde"] }
regex = "1.11.1"
pyo3 = { version = "0.29", optional = true, features = ["abi3-py312", "extension-module"] }
sysinfo = "0.38.4"
clap = { version = "4.5.59", features = ["derive"] }
anyhow = "1.0.101"
which = "8.0.2"

[features]
default = ["python"]
python = ["pyo3"]

[project]
name = "thegent_discovery_rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = false
