[package]
[package]
name = "thegent-discovery-rs"
version = "0.1.0"
edition = "2021"
description = "Agent discovery using shell commands for system monitoring"

[[bin]]
name = "thegent-discovery"
path = "src/main.rs"

[lib]
name = "thegent_discovery"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
regex = "1.11.1"
pyo3 = { version = "0.24.1", optional = true, features = ["abi3-py312", "extension-module"] }
sysinfo = "0.33.1"
clap = { version = "4.5.59", features = ["derive"] }
anyhow = "1.0.101"
which = "7.0.0"

[features]
default = ["python"]
python = ["pyo3"]
