[build-system]
requires = ["maturin>=0.14,<0.15"]
build-backend = "maturin"

[project]
name = "thegent-discovery"
version = "0.1.0"
description = "Agent discovery using sysinfo for live system monitoring"
authors = [{ name = "TheGent Team" }]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["agent", "discovery", "sysinfo", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = []

[tool.maturin]
module-name = "thegent_discovery"
features = ["python"]
