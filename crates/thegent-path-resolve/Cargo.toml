[package]
name = "thegent-path-resolve"
version = "0.1.0"
edition = "2021"
description = "Fast PATH resolution for thegent"

[lib]
name = "thegent_path_resolve"
crate-type = ["cdylib", "rlib"]

[dependencies]
which = "6"
pyo3 = { version = "0.24.1", optional = true, features = ["abi3-py312", "extension-module"] }
clap = { version = "4.5.59", features = ["derive"] }
serde_json = "1.0.149"

[features]
default = []
python = ["pyo3"]
