[package]
name = "thegent-path-resolve"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast PATH resolution for thegent"

[lib]
name = "thegent_path_resolve"
crate-type = ["cdylib", "rlib"]

[dependencies]
which = "6"
pyo3 = { version = "0.29", optional = true, features = ["abi3-py312", "extension-module"] }
clap = { version = "4.5.59", features = ["derive"] }
serde_json = "1.0.149"

[features]
default = []
python = ["dep:pyo3"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
overflow-checks = false
