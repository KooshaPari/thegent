[package]
name = "thegent-git"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BKM-06: thegent-git Rust extension (gitoxide for HEAD/status/diff)"

[lib]
name = "thegent_git"
crate-type = ["cdylib"]

[[bin]]
name = "thegent-git"
path = "src/main.rs"
required-features = ["cli"]

strip = true
[dependencies]
gix = { version = "0.83.0", default-features = false, features = [
    "max-performance-safe",
    "status",
    "dirwalk",
    "sha1",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
pyo3 = { version = "0.29", optional = true, features = ["abi3-py312", "extension-module"] }
clap = { version = "4.5.23", features = ["derive"], optional = true }

[features]
default = ["python"]
python = ["dep:pyo3"]
cli = ["dep:clap"]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = false
