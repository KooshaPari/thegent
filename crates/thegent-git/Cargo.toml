[package]
name = "thegent-git"
version = "0.1.0"
edition = "2021"
description = "BKM-06: thegent-git Rust extension (gitoxide for HEAD/status/diff)"

[lib]
name = "thegent_git"
crate-type = ["cdylib"]

[[bin]]
name = "thegent-git"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
gix = { version = "0.79.0", default-features = false, features = [
    "max-performance-safe",
    "status",
    "dirwalk",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
pyo3 = { version = "0.23.4", features = ["extension-module"] }
clap = { version = "4.5.23", features = ["derive"], optional = true }

[features]
default = []
cli = ["dep:clap"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
