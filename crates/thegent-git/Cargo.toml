[package]
name = "thegent-git"
version = "0.1.0"
edition = "2021"
description = "BKM-06: thegent-git Rust extension (libgit2 for HEAD/status/diff)"

[lib]
name = "thegent_git"
crate-type = ["cdylib", "rlib"]

[dependencies]
git2 = "0.20.4"
gix = { version = "0.79.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
pyo3 = { version = "0.28.2", features = ["extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]
gix = ["dep:gix"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
