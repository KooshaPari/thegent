[package]
name = "thegent-parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "thegent_parser"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.2", features = ["extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = "0.13"
anyhow = "1.0"
