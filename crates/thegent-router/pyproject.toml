[build-system]
requires = ["maturin>=0.14,<0.15"]
build-backend = "maturin"

[project]
name = "thegent-router"
version = "0.1.0"
description = "Pareto routing engine with hysteresis for task distribution"
authors = [{ name = "TheGent Team" }]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["routing", "task-distribution", "pareto", "hysteresis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[tool.maturin]
module-name = "thegent_router"
features = ["python"]
