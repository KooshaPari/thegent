[package]
name = "thegent-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui-based TUI for thegent: Phase 2 interactive widgets"
authors = ["thegent"]
license = "MIT"

[[bin]]
name = "thegent-tui"
path = "src/main.rs"

[lib]
name = "thegent_tui"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1"
directories = "6"
once_cell = "1"
toml = "1.1"

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
