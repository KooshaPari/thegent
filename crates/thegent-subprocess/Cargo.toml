[package]
name = "thegent-subprocess"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Safe subprocess execution for thegent"
keywords = ["subprocess", "process", "shell", "thegent"]
categories = ["os", "development-tools"]

[lib]
name = "thegent_subprocess"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.3", optional = true, features = ["abi3-py312", "extension-module"] }
thiserror = "1.0"
which = "8.0"

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
tempfile = "3.0"
