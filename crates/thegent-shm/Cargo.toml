[package]
name = "thegent-shm"
version = "0.1.0"
edition = "2021"
description = "BKM-05: State-SHM: CircuitBreaker + XP in memory-mapped Rust"

[[bin]]
name = "thegent-shm"
path = "src/main.rs"

[lib]
name = "thegent_shm"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
memmap2 = "0.9.5"
libc = "0.2.170"
pyo3 = { version = "0.24.1", optional = true }
once_cell = "1.20.3"
parking_lot = "0.12.3"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.17.1"

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
