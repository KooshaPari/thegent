[package]
name = "thegent-memory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/anthropics/thegent"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.12.11", features = ["json", "rustls-tls"] }
compio = { version = "0.13.0", optional = true, features = ["runtime-tokio"] }
moka = { version = "0.12.10", optional = true }
sonic-rs = { version = "0.4.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
thiserror = "2.0.18"
async-trait = "0.1.86"
sha2 = "0.10.8"
base16ct = "1.0.1"
log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
ed25519-dalek = "3.0.0-pre.6"
base64 = "0.22.1"

[features]
default = []
compio = ["dep:compio"]
moka = ["dep:moka"]
sonic = ["dep:sonic-rs"]

[dev-dependencies]
mockito = "1.7.2"
tokio-test = "0.4.5"

[[test]]
name = "client_tests"
path = "tests/client_tests.rs"
