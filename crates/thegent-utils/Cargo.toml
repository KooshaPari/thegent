[package]
name = "thegent-utils"
version = "0.1.0"
edition = "2021"
description = "Utility binaries for thegent: process monitoring, safe grep, etc."
license = "MIT"
repository = "https://github.com/phenotype/thegent"

[[bin]]
name = "thegent-monitor"
path = "src/bin/monitor.rs"

[[bin]]
name = "thegent-grep"
path = "src/bin/grep.rs"

[[bin]]
name = "wl138-decomposition-progress"
path = "src/bin/wl138_decomposition_progress.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
anyhow = "1.0.101"
colored = "3.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
regex = "1.11.1"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.17.1"
