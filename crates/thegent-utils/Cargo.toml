[package]
name = "thegent-utils"
version = "0.1.0"
edition = "2021"
description = "Utility binaries for thegent: process monitoring, safe grep, etc."

[[bin]]
name = "thegent-monitor"
path = "src/bin/monitor.rs"

[[bin]]
name = "thegent-grep"
path = "src/bin/grep.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
anyhow = "1.0.101"
colored = "3.0.0"
regex = "1.11.1"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.17.1"
