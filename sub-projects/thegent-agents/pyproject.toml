[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "thegent-agents"
dynamic = ["version"]
description = "Agent orchestration, planning, memory, team management"
requires-python = ">=3.10"
dependencies = [
    "fastmcp[tasks]>=3.0.0",
    "pydantic>=2.12.5",
    "litellm>=1.81.13",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
    "httpx>=0.28.1",
]

[project.scripts]
thegent-agents = "thegent_agents.__main__:app"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_agents"]
