[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "thegent-mcp"
dynamic = ["version"]
description = "Unified MCP server aggregator — ecosystem tool consolidation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp[tasks]>=3.0.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "structlog>=24.0.0",
]

[project.scripts]
thegent-mcp = "thegent_mcp.__main__:app"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/thegent_mcp"]
