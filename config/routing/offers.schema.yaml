# Helios Router — Offer schema (Phase 0)
# offerId = provider:plan:modelId
# Per CHATGPT_PARETO_ROUTER_EXTENSION Appendix A

schema_version: 1
description: Canonical offer definitions for Pareto routing

offers:
  - offerId: antigravity:proxy:gemini-3-flash
    modelId: gemini-3-flash
    provider: antigravity
    planId: proxy
    pricing:
      type: payg_token
      inputPerMTokUsd: 0.000075
      outputPerMTokUsd: 0.0003
    capabilities:
      tools: true
      jsonMode: true
      vision: true

  - offerId: glm:proxy:glm-5
    modelId: glm-5
    provider: glm
    planId: proxy
    pricing:
      type: payg_token
      inputPerMTokUsd: 0.0005
      outputPerMTokUsd: 0.0007

  - offerId: minimax:proxy:minimax-m2.5
    modelId: minimax-m2.5
    provider: minimax
    planId: prompt_rate_limited
    pricing:
      type: prompt_rate_limited
      eucPerMTokUsd: 0.0004

  - offerId: claude:direct:claude-opus-4.6
    modelId: claude-opus-4.6
    provider: claude
    planId: fixed_bucket
    pricing:
      type: fixed_bucket_tokens
      eucBlendedPerMTokUsd: 0.02

  - offerId: codex:direct:gpt-5.3-codex
    modelId: gpt-5.3-codex
    provider: codex
    planId: fixed_bucket
    pricing:
      type: fixed_bucket_tokens
      eucBlendedPerMTokUsd: 0.01
