# Helios Router — Plan schema (Phase 1 Economics)
# Per CHATGPT_PARETO_DEEP_02 plan types

schema_version: 1
description: Subscription plan definitions for shadow pricing

plans:
  - planId: proxy
    type: payg_token
    description: API-key pay-per-token (antigravity, glm, minimax via proxy)

  - planId: fixed_bucket
    type: fixed_bucket_tokens
    monthlyFeeUsd: 200
    priorTokPerMonth: 11000000000
    description: Claude Max, Codex ~11B tokens

  - planId: prompt_rate_limited
    type: prompt_rate_limited
    promptsPerWindow: 300
    windowHours: 5
    description: Minimax 300 prompts / 5 hours

  - planId: volatile_free
    type: volatile_free
    eucFloorPerMTokUsd: 0.001
    description: Promo/preview models
