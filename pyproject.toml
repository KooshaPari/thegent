[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thegent"
version = "0.1.0"
description = "Unified agent orchestration CLI for Factory skills and droids"
authors = [{ name = "Koosha Paridehpour", email = "kooshapari@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
urls = { "Homepage" = "https://github.com/router-for-me/thegent", "Repository" = "https://github.com/router-for-me/thegent", "Documentation" = "https://github.com/router-for-me/thegent#readme" }
keywords = ["ai", "agent", "mcp", "orchestration", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.21.1",
    "rich>=14.3.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "tenacity>=9.0.0",
    "pyyaml>=6.0",
    "fastmcp[tasks]>=3.0.0rc1",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "litellm>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "ty>=0.0.2",
    "basedpyright>=1.12.0",
    "pre-commit>=3.6.0",
    "tach>=0.4.0",
    "vulture>=2.11",
    "radon>=6.0",
]

[project.scripts]
thegent = "thegent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: marks unit tests",
    "integration: marks tests that call real agents (deselect with -m 'not integration')",
    "e2e: marks end-to-end CLI tests",
    "slow: marks slow tests (deselect with -m 'not slow')",
    "asyncio: marks async tests (pytest-asyncio)",
    "load: marks load/stress tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:ImportError while loading.*logfire-plugin:UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/conftest.py"]
# P7: Per-test context for coverage-based affected test selection. Use: pytest --cov=src --cov-context=test

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["templates/*", "src/fastmcp/*", "src/starlette/*", "src/opentelemetry/*", "src/key_value/*", ".worktrees/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4",
    "DTZ", "T20", "SIM", "TCH", "RUF", "PT", "ERA", "PL", "PERF", "FURB",
    "PIE", "ARG", "PTH", "ANN", "BLE", "FBT", "RET", "SLF",
]
ignore = [
    "E501", "ANN101", "ANN102", "S101", "A002", "PLC0415", "PLR0913",
    "FBT001", "FBT002", "FBT003", "BLE001", "S603", "S607", "PLR0912", "PLR0915",
    "ANN001", "ANN201", "ANN202", "ANN401", "PLR2004", "S310", "ARG001",
    "ARG002", "PTH123", "PTH117", "S606", "RUF002", "RUF001", "S110",
    "S112", "PLR0911", "SIM102", "ANN003", "PERF401", "DTZ005", "B904",
    "PLW2901", "B008", "F811", "N818", "ERA001", "INP001", "D103", "SIM117",
    "E722", "RET504", "PLW0603", "PLW0602", "S324", "PTH105", "PTH116",
    "SIM103", "F841", "N806", "F401", "E402", "RUF100", "E741", "ARG005"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN", "ARG001", "ARG002", "ARG003", "ARG005", "PLR2004", "S101", "FBT001", "FBT003",
    "S108", "SLF001", "ERA001", "SIM117", "PLR0915", "E741", "N806", "S104", "S105", "S106",
    "PT019", "PERF401", "E402", "PTH101", "S103", "PT011", "PLW2901", "S112", "BLE001", "PLC0415"
]
"scripts/*" = ["ANN", "T201", "S603", "S607", "BLE001", "E402", "PLC0415", "PLR0912", "PLR0915", "FBT001", "FBT002", "S110"]

[tool.ty]
[tool.ty.src]
include = ["src", "tests"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12.20250915",
]
# basedpyright handles many things ruff/mypy might miss, or can be used for CI final check
# to be even stricter than ty
