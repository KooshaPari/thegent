[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "thegent"
dynamic = ["version"]
description = "Unified agent orchestration CLI for Factory skills, droids, and multi-agent workflows"
authors = [
    { name = "Koosha Paridehpour", email = "kooshapari@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
urls = { "Homepage" = "https://github.com/kooshapari/thegent", "Repository" = "https://github.com/kooshapari/thegent", "Documentation" = "https://github.com/kooshapari/thegent#readme" }
keywords = ["ai", "agent", "mcp", "orchestration", "automation", "cli", "factory", "droid", "codex", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.16.0",
    "rich>=13.9.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
    "ruamel.yaml>=0.18.6",
    "fastmcp[tasks]>=3.0.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
    "granian>=1.7.4",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "litellm>=1.81.13",
    "tomlkit>=0.13.2",
    "rtoml>=0.12.0",
    "tomli>=2.2.1",
    "cachetools>=5.5.2",
    "diskcache>=5.6.3",
    "watchdog>=6.0.0",
    "watchfiles>=1.0.4",
    "fastjsonschema>=2.21.1",
    "psutil>=7.0.0",
    "pybreaker>=1.2.0",
    "textual>=1.0.0",
    "duckduckgo-search>=7.3.2",
    "praw>=7.8.1",
    "playwright>=1.50.0",
    "extism>=1.0.2",
    "ujson; implementation_name == 'pypy'",
    "orjson; implementation_name == 'cpython'",
]

[project.optional-dependencies]
fast = [
    "curl-cffi>=0.6.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.1",
    "ty>=0.0.2",
    "basedpyright>=1.31.1",
    "pre-commit>=4.1.0",
    "tach>=0.26.0",
    "vulture>=2.14",
    "radon>=6.0",
    "psleak>=0.1.0",
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12.20250915",
]

[project.scripts]
thegent = "thegent.main:app"
clode = "thegent.clode_main:app"
roid = "thegent.roid_main:app"
dex = "thegent.dex_main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"
[tool.hatch.build.targets.wheel.force-include]
"hooks" = "thegent/hooks"
"skills" = "thegent/skills"
"src/thegent/py.typed" = "thegent/py.typed"

[tool.uv]
managed = true
override-dependencies = [
    "hf-xet==0.0.0; implementation_name == 'pypy'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src"]
asyncio_mode = "auto"
markers = [
    "unit: marks unit tests",
    "integration: marks tests that call real agents (deselect with -m 'not integration')",
    "e2e: marks end-to-end CLI tests",
    "slow: marks slow tests (deselect with -m 'not slow')",
    "asyncio: marks async tests (pytest-asyncio)",
    "load: marks load/stress tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:ImportError while loading.*logfire-plugin:UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/conftest.py"]
dynamic_context = "test_function"

[tool.coverage.report]
# Agent-Only Environment: 100% coverage required (not 80%)
# Since NO humans will test this, comprehensive automated coverage is CRITICAL
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["templates/*", "src/fastmcp/*", "src/starlette/*", "src/opentelemetry/*", "src/key_value/*", ".worktrees/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4",
    "DTZ", "T20", "SIM", "TCH", "RUF", "PT", "ERA", "PL", "PERF", "FURB",
    "PIE", "ARG", "PTH", "ANN", "BLE", "FBT", "RET", "SLF",
]
ignore = [
    "E501", "ANN101", "ANN102", "S101", "A002", "PLC0415", "PLR0913",
    "FBT001", "FBT002", "FBT003", "BLE001", "S603", "S607", "PLR0912", "PLR0915",
    "ANN001", "ANN201", "ANN202", "ANN401", "PLR2004", "S310", "ARG001",
    "ARG002", "PTH123", "PTH117", "S606", "RUF002", "RUF001", "S110",
    "S112", "PLR0911", "SIM102", "ANN003", "PERF401", "DTZ005", "B904",
    "PLW2901", "B008", "F811", "N818", "ERA001", "INP001", "D103", "SIM117",
    "E722", "RET504", "PLW0603", "PLW0602", "S324", "PTH105", "PTH116",
    "SIM103", "F841", "N806", "F401", "E402", "RUF100", "E741", "ARG005"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN", "ARG001", "ARG002", "ARG003", "ARG005", "PLR2004", "S101", "FBT001", "FBT003",
    "S108", "SLF001", "ERA001", "SIM117", "PLR0915", "E741", "N806", "S104", "S105", "S106",
    "PT019", "PERF401", "E402", "PTH101", "S103", "PT011", "PLW2901", "S112", "BLE001", "PLC0415"
]
"scripts/*" = ["ANN", "T201", "S603", "S607", "BLE001", "E402", "PLC0415", "PLR0912", "PLR0915", "FBT001", "FBT002", "S110"]

[tool.ty]
[tool.ty.src]
include = ["src", "tests"]
python-version = "3.10"

[tool.ty.rules]
# Error on all type violations
possibly-unbound-attribute = "error"
possibly-unbound-import = "error"
unresolved-attribute = "error"
unresolved-import = "error"
invalid-type-form = "error"

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingTypeStubs = false
reportMissingImports = true
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
    "types-pyyaml>=6.0.12.20250915",
]
