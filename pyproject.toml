[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thegent"
version = "0.1.0"
description = "Unified agent orchestration CLI for Factory skills and droids"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.21.1",
    "rich>=14.3.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "tenacity>=9.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "ty>=0.0.2",
    "basedpyright>=1.12.0",
    "pre-commit>=3.6.0",
    "tach>=0.4.0",
    "vulture>=2.11",
]
mcp = [
    "fastmcp>=3.0.0rc1",
    "fastmcp[tasks]>=3.0.0rc1",
]

[project.scripts]
thegent = "thegent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thegent"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: marks unit tests",
    "integration: marks tests that call real agents (deselect with -m 'not integration')",
    "e2e: marks end-to-end CLI tests",
    "slow: marks slow tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:ImportError while loading.*logfire-plugin:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["templates/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4",
    "DTZ", "T20", "SIM", "TCH", "RUF", "PT", "ERA", "PL", "PERF", "FURB",
    "PIE", "ARG", "PTH", "ANN", "BLE", "FBT", "RET", "SLF",
]
ignore = [
    "E501", "ANN101", "ANN102", "S101", "A002", "PLC0415", "PLR0913",
    "FBT001", "FBT002", "FBT003", "BLE001", "S603", "S607", "PLR0912", "PLR0915",
    "ANN001", "ANN201", "ANN202", "ANN401", "PLR2004", "S310", "ARG001",
    "ARG002", "PTH123", "PTH117", "S606", "RUF002", "RUF001", "S110",
    "S112", "PLR0911", "SIM102", "ANN003", "PERF401", "DTZ005", "B904",
    "PLW2901", "B008", "F811", "N818", "ERA001", "INP001", "D103", "SIM117",
    "E722", "RET504", "PLW0603", "PLW0602", "S324", "PTH105", "PTH116",
    "SIM103", "F841", "N806", "F401", "E402", "RUF100", "E741", "ARG005"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN", "ARG001", "ARG002", "ARG003", "ARG005", "PLR2004", "S101", "FBT001", "FBT003",
    "S108", "SLF001", "ERA001", "SIM117", "PLR0915", "E741", "N806", "S104", "S105", "S106",
    "PT019", "PERF401", "E402", "PTH101", "S103", "PT011", "PLW2901", "S112", "BLE001", "PLC0415"
]
"scripts/*" = ["ANN", "T201", "S603", "S607", "BLE001", "E402", "PLC0415", "PLR0912", "PLR0915", "FBT001", "FBT002", "S110"]

[tool.ty]
[tool.ty.src]
include = ["src", "tests"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
# basedpyright handles many things ruff/mypy might miss, or can be used for CI final check
# to be even stricter than ty
