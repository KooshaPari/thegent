# Phenotype Shared Infrastructure Services
# Manages singleton service instances shared across all repos.
# Start once per dev session: process-compose -f process-compose.shared.yml up
#
# Port assignments:
#   5432 - PostgreSQL 16
#   4222 - NATS (+ 8222 monitoring)
#   6379 - Dragonfly (Redis-compatible)
#
# Worktree services MUST use ports in range 30000-39999.

version: "0.5"

log_location: /tmp/phenotype-logs

processes:

  postgres:
    description: "PostgreSQL 16 — shared relational database"
    command: >
      sh -c '
        if pg_isready -p 5432 -q; then
          echo "[postgres] already running on :5432, skipping start"
          sleep infinity
        else
          pg_ctl -D /opt/homebrew/var/postgresql@16 start -l /tmp/phenotype-logs/postgres.log -w
          echo "[postgres] started"
          sleep infinity
        fi
      '
    readiness_probe:
      exec:
        command: "pg_isready -p 5432 -q"
      initial_delay_seconds: 1
      period_seconds: 3
      failure_threshold: 10
      success_threshold: 1
    environment:
      - "PGPORT=5432"
      - "PGDATA=/opt/homebrew/var/postgresql@16"
    restart_policy:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  nats:
    description: "NATS with JetStream — shared message bus"
    command: >
      sh -c '
        if curl -sf http://localhost:8222/healthz >/dev/null 2>&1; then
          echo "[nats] already running on :4222/:8222, skipping start"
          sleep infinity
        else
          nats-server \
            --port 4222 \
            --http_port 8222 \
            --jetstream \
            --store_dir /tmp/nats-jetstream \
            --log /tmp/phenotype-logs/nats.log \
            --pid /tmp/nats.pid
        fi
      '
    readiness_probe:
      http_get:
        host: localhost
        port: 8222
        path: /healthz
      initial_delay_seconds: 1
      period_seconds: 3
      failure_threshold: 10
      success_threshold: 1
    restart_policy:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  dragonfly:
    description: "Dragonfly — Redis-compatible cache (replaces Redis)"
    command: >
      sh -c '
        if redis-cli -p 6379 ping 2>/dev/null | grep -q PONG; then
          echo "[dragonfly] already running on :6379, skipping start"
          sleep infinity
        else
          dragonfly \
            --port 6379 \
            --dir /tmp/dragonfly \
            --logtostderr
        fi
      '
    readiness_probe:
      exec:
        command: "redis-cli -p 6379 ping"
      initial_delay_seconds: 1
      period_seconds: 3
      failure_threshold: 10
      success_threshold: 1
    restart_policy:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # Temporal is managed separately (process-compose.temporal.yml)
  # because it has additional dependencies and may already be running.
  # Start it with: process-compose -f process-compose.temporal.yml up
